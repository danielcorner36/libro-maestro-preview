<style>
:root{--ink:#29243b;--muted:#777287;--paper:#f1ede5;--white:#fffdf8;--line:#e1d9cb;--green:#302b4a;--green2:#7d6645;--mint:#eeeaf2;--gold:#bd995e;--rose:#985a51;--shadow:0 16px 42px #29243b12;--radius:19px}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:radial-gradient(ellipse at 15% 5%,#37304f 0%,#1b1b31 44%,#141724 100%);color:#f4f0e6;padding:27px 17px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh}.brand{padding:0 12px}.brand-mark{font:700 12px/1.2 ui-serif,Georgia,serif;letter-spacing:.18em;text-transform:uppercase;color:#ddc89d}.brand h1{font:500 24px/1.1 ui-serif,Georgia,serif;margin:8px 0 4px}.brand p{margin:0;color:#b9c9c0;font-size:12px}.nav{display:grid;gap:5px}.nav button{border:0;text-align:left;color:#d5e0d9;background:transparent;border-radius:11px;padding:10px 12px;display:flex;gap:11px;align-items:center;font-size:13px}.nav button:hover,.nav button.active{background:#ffffff17;color:white}.nav .num{font-size:10px;color:#b6c9bd;opacity:.75;width:17px}.side-note{margin-top:auto;border-top:1px solid #ffffff24;padding:17px 11px 0;color:#bdccc4;font-size:11px}.side-note strong{display:block;color:#e6d6b4;font-size:12px;margin-bottom:5px}.main{min-width:0}.topbar{height:74px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,54px);background:#f8f6f1d9;position:sticky;top:0;z-index:4;backdrop-filter:blur(14px)}.crumb{font-size:12px;color:var(--muted)}.crumb b{color:var(--ink);font-weight:650}.top-actions{display:flex;align-items:center;gap:9px}.save-state{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:7px}.save-state:before{content:"";width:7px;height:7px;background:#54a078;b r-color:#cfe0d3;background:#edf5ef;color:#42664c}.notice.red{border-color:#e8ccc4;background:#fbefeb;color:#8b5144}.chapter-row{border:1px solid var(--line);border-radius:13px;background:#fff;padding:13px 15px;margin:9px 0;display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:start}.chapter-row input{border:0;border-bottom:1px solid #eee;background:transparent;padding:2px 4px;font-weight:650;width:100%;outline:none}.chapter-row textarea{margin-top:8px;width:100%;border:1px solid #e8e4dc;border-radius:8px;padding:10px;min-height:210px;resize:vertical;line-height:1.65}.chapter-meta{font-size:10px;color:var(--muted);margin-top:5px}.icon-x{border:0;background:transparent;color:#8d9690;font-size:17px}.source-row{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:8px;margin:8px 0}.source-row input{min-width:0;border:1px solid var(--line);border-radius:9px;padding:9px}.source-card{border:1px solid var(--line);border-radius:13px;background:#fffefa;padding:12px;margin:9px 0}.source-card summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px}.source-card summary::-webkit-details-marker{display:none}.source-card .source-name{min-width:0;overflow-wrap:anywhere;font-weight:650}.source-card .source-fields{margin-top:13px}.source-card .source-meta{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}.source-card .field textarea{min-height:72px}.source-badges{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.checklist{display:grid;gap:8px}.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #f0ede7;font-size:12px}.check:last-child{border:0}.check input{accent-color:var(--green);margin-top:3px}.check small{display:block;color:var(--muted);font-size:10px}.rating-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #f0ede7}.rating-row:last-child{border:0}.rating-row strong{font-size:12px}.rating-row p{font-size:10px;color:var(--muted);margin:2px 0 0}.rating-row select{border:1px solid var(--line);border-radius:8px;padding:7px}.cover-wrap{display:grid;grid-template-columns:minmax(180px,240px) 1fr;gap:23px;align-items:center}.book-cover{aspect-ratio:2/3;border-radius:4px 10px 10px 4px;background:linear-gradient(145deg,#1c473e,#487863);color:#f9f3e3;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;box-shadow:14px 13px 24px #23392a28;border-left:8px solid #17392f}.book-cover .cover-kicker{font-size:8px;letter-spacing:.24em;text-transform:uppercase;color:#dbca9e;margin-bottom:25px}.book-cover strong{font:500 25px/1.12 ui-serif,Georgia,serif}.book-cover em{font:italic 12px ui-serif,Georgia,serif;margin-top:13px;color:#e6decc}.book-cover span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-top:auto}.score{font:500 40px ui-serif,Georgia,serif;color:var(--green)}.progress{height:7px;background:#e9e7e0;border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;background:#5b9276;border-radius:8px;transition:width .3s}.empty{text-align:center;padding:32px 15px;color:var(--muted)}.empty strong{display:block;font:500 21px ui-serif,Georgia,serif;color:var(--ink);margin-bottom:6px}.footer-note{font-size:10px;color:#879189;margin-top:19px}.modal-back{position:fixed;inset:0;background:#15241ec9;z-index:9;display:grid;place-items:center;padding:18px}.modal{width:min(520px,100%);background:var(--white);border-radius:20px;padding:24px;box-shadow:0 25px 80px #0004}.modal h2{font:500 26px ui-serif,Georgia,serif;margin:0 0 7px}.hidden{display:none!important}.toast{position:fixed;right:20px;bottom:20px;background:#173c33;color:#fff;padding:12px 17px;border-radius:11px;box-shadow:var(--shadow);font-size:12px;z-index:10}.kpi-tag{font-size:10px;background:#eff1e9;color:#5a695f;padding:4px 8px;border-radius:20px}.foot{margin-top:28px;border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-between;gap:15px;color:#879189;font-size:10px}.mobile-head{display:none}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto;padding:12px 13px;gap:10px}.brand{display:flex;align-items:center;gap:10px}.brand h1{font-size:19px;margin:0}.brand p,.brand-mark,.side-note{display:none}.nav{display:flex;overflow:auto;gap:5px;padding:2px}.nav button{white-space:nowrap;padding:8px 10px;font-size:11px}.nav .num{display:none}.topbar{height:57px}.content{padding-top:23px}.stats{grid-template-columns:repeat(2,1fr)}.grid.three{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.grid.two,.grid.three,.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.step{grid-template-columns:31px 1fr}.step>.pill{grid-column:2;justify-self:start}.source-row{grid-template-columns:1fr}.cover-wrap{grid-template-columns:1fr;justify-items:center}.cover-wrap .cover-details{width:100%}.top-actions .save-state{display:none}.card{padding:17px}.section-head{align-items:start;flex-direction:column}.book-cover{width:205px}}

<style>
.home-welcome{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(275px,.8fr);gap:14px;margin:14px 0 18px}.home-welcome .hero{margin:0;min-height:270px;display:flex;flex-direction:column;justify-content:center}.home-welcome .hero h2{max-width:570px}.home-actions{margin:12px 0 0}.home-actions .btn{font-size:12px}.home-next{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:10px}.home-next .eyebrow{font-size:9px}.home-next h2{margin:0}.home-next .smalltext{line-height:1.55;margin:0}.home-step{display:flex;align-items:center;gap:9px}.home-disclaimer{border-top:1px solid var(--line);padding-top:9px;font-size:10px;color:var(--muted);line-height:1.45}.home-roadmap{margin-top:22px}.home-roadmap>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center}.home-roadmap>summary::-webkit-details-marker{display:none}.home-roadmap>summary::after{content:"＋";color:var(--gold);font-size:20px}.home-roadmap[open]>summary::after{content:"−"}.home-roadmap .step-list{margin-top:16px}.feedback-panel,.provenance-panel{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fcfaf5}.provenance-panel{background:#f7f4ed}.feedback-panel>summary,.provenance-panel>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}.feedback-panel>summary::-webkit-details-marker,.provenance-panel>summary::-webkit-details-marker{display:none}.feedback-panel .field textarea,.provenance-panel .field textarea{min-height:74px}.feedback-panel .footer-note,.provenance-panel .footer-note{margin:9px 0 0}.source-chapter-list{display:grid;gap:6px;max-height:170px;overflow:auto;padding:9px;border:1px solid var(--line);border-radius:9px;background:#fffdf8}.source-chapter-list label{display:flex;align-items:center;gap:8px;font-size:12px}.source-chapter-list input{accent-color:var(--green)}.claims-panel{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#f4f1e9}.claims-panel>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}.claims-panel>summary::-webkit-details-marker{display:none}.claim-card{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fffdf8}.claim-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:9px}.claim-card textarea{min-height:70px}.claim-suggestions{margin:10px 0}.suggestion-list{display:grid;gap:8px;margin-top:9px}.suggestion-card{padding:10px;border:1px dashed var(--gold);border-radius:10px;background:#fffdf8}.suggestion-card p{margin:0 0 6px;white-space:pre-wrap}.suggestion-card .toolbar{margin-top:8px}@media(max-width:900px){.home-welcome{grid-template-columns:1fr}.home-welcome .hero{min-height:unset}}@media(max-width:600px){.home-actions{display:grid;grid-template-columns:1fr}.home-actions .btn{width:100%}.home-roadmap>summary{align-items:flex-start;flex-direction:column}.claim-grid{grid-template-columns:1fr}}

<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" class="toast hidden"></div>
<script src="./fflate.js"></script>
<script>
(()=>{'use strict';
const STORAGE='libro_maestro_v1';
const stages=[['concept','01','Idea y lector','Definir para quién escribes, qué necesidad atiende y qué lo hará distinto.'],['research','02','Investigación y sustento','Construir una base confiable de fuentes, evidencia, permisos y contexto.'],['structure','03','Arquitectura del libro','Diseñar promesa, recorrido, capítulos, ritmo y progresión.'],['draft','04','Manuscrito','Escribir con una voz consistente y metas realistas por capítulo.'],['development','05','Edición de fondo','Revisar estructura, claridad, argumento, personajes o utilidad.'],['line','06','Estilo y corrección','Pulir voz, gramática, ortografía, puntuación y consistencia.'],['integrity','07','Originalidad y derechos','Atribuir ideas, revisar permisos, citas, privacidad y uso responsable de IA.'],['production','08','Diseño y producción','Preparar cubierta, interiores, metadatos, pruebas y archivos finales.'],['release','09','Publicación y lanzamiento','Cumplir la guía vigente del canal y planear distribución y difusión.']];
const defaults=()=>({version:1,created:new Date().toISOString(),project:{title:'',author:'',genre:'Ensayo',audience:'',promise:'',objective:'',language:'Español (México)',format:'Impreso y ebook',status:'En desarrollo',coverSubtitle:'',color:'#403653',market:'México / internacional'},chapters:[],sources:[],sections:[],tasks:{},ratings:{},notes:{},platform:'Autopublicación',view:'home',library:[],activeId:'',bible:{series:'',volume:'',world:'',canon:'',characters:[],relations:[],timeline:''},production:{profile:'Impreso 6 × 9',trim:'6 × 9 pulgadas',paper:'Blanco / crema',font:'Garamond',description:'',keywords:''}});
let state=load();let currentView='home';let toastTimer;
function load(){try{const raw=localStorage.getItem(STORAGE);if(raw){const s=JSON.parse(raw);return {...defaults(),...s,project:{...defaults().project,...s.project},tasks:s.tasks||{},ratings:s.ratings||{},notes:s.notes||{},chapters:(s.chapters||[]).map((c,i)=>({...c,id:c.id||'ch-'+i+'-'+Date.now(),versions:c.versions||[],claims:Array.isArray(c.claims)?c.claims:[]})),sources:(s.sources||[]).map((s,i)=>({...s,id:s.id||'source-'+i+'-'+Date.now(),chapterIds:Array.isArray(s.chapterIds)?s.chapterIds:[]})),sections:s.sections||[],library:s.library||[],activeId:s.activeId||'',production:{...defaults().production,...(s.production||{})},bible:{...defaults().bible,...(s.bible||{}),characters:s.bible?.characters||[],relations:s.bible?.relations||[]}}}}catch(e){}return defaults()}
function save(){state.updated=new Date().toISOString();state.library=state.library||[];if(state.project.title){if(!state.activeId)state.activeId='book-'+Date.now();const snap={id:state.activeId,created:state.created||state.updated,updated:state.updated,project:state.project,chapters:state.chapters,sources:state.sources,sections:state.sections,tasks:state.tasks,ratings:state.ratings,notes:state.notes,platform:state.platform,production:state.production,bible:state.bible};const i=state.library.findIndex(x=>x.id===state.activeId);if(i>=0)state.library[i]=snap;else state.library.unshift(snap)}try{localStorage.setItem(STORAGE,JSON.stringify(state));const el=document.getElementById('save-status');if(el)el.textContent='Guardado en este dispositivo'}catch(e){const el=document.getElementById('save-status');if(el)el.textContent='No se pudo guardar; exporta una copia'}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function wc(s){return (s.trim().match(/\b[\p{L}\p{N}][\p{L}\p{N}'’\-]*\b/gu)||[]).length}
function totalWords(){return state.chapters.reduce((n,c)=>n+wc(c.draft||''),0)}
function doneCount(){return Object.values(state.tasks).filter(Boolean).length}
function taskCount(){return document.querySelectorAll('[data-task]').length || Object.keys(state.tasks).length}
function readiness(){const completed=doneCount();const expected=41;return Math.min(100,Math.round(completed/Math.max(expected,Object.keys(state.tasks).length)*100))}
function showToast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.classList.add('hidden'),2400)}
function title(){return state.project.title||'Tu libro, en construcción'}
function nav(){return `<aside class="sidebar"><div class="brand"><div><div class="brand-mark">El gabinete editorial</div><h1>Libro Maestro</h1><p>Un atlas para publicar con oficio</p></div></div><nav class="nav">${[['home','⌂','Inicio'],['scope','✦','Alcance completo'],['concept','01','Concepto'],['research','02','Investigación'],['structure','03','Estructura'],['bible','✦','Biblia narrativa'],['draft','04','Manuscrito'],['development','05','Edición de fondo'],['line','06','Estilo y corrección'],['integrity','07','Originalidad y derechos'],['production','08','Diseño y producción'],['release','09','Publicación']].map(([id,n,label])=>`<button data-view="${id}" class="${currentView===id?'active':''}"><span class="num">${n}</span>${label}</button>`).join('')}</nav><div class="side-note"><strong>Una obra sólida, paso a paso.</strong>Las revisiones automáticas son alertas preliminares; la decisión editorial y la verificación final siguen siendo humanas.</div></aside>`}
function shell(content){document.getElementById('app').innerHTML=`<div class="app">${nav()}<section class="main"><header class="topbar"><div class="crumb">Libro Maestro <span> / </span><b>${esc(pageName(currentView))}</b></div><div class="top-actions"><button class="iconbtn" data-action="open-library">Biblioteca</button><span class="save-state" id="save-status">Guardado en este dispositivo</span><button class="iconbtn" data-action="export-json">Respaldo</button></div></header><main class="content">${content}<footer class="foot"><span>Libro Maestro · espacio de trabajo local</span><span>Tu contenido permanece en este navegador hasta que lo exportes.</span></footer></main></section></div>${document.getElementById('modal-root').innerHTML}`;bind()}
function pageName(v){const x={home:'Inicio',scope:'Alcance completo',concept:'Concepto',research:'Investigación',structure:'Estructura',bible:'Biblia narrativa',draft:'Manuscrito',development:'Edición de fondo',line:'Estilo y corrección',integrity:'Originalidad y derechos',production:'Diseño y producción',release:'Publicación'};return x[v]||'Inicio'}
function pageIntro(k,desc){return `<div class="eyebrow">Taller editorial · ${esc(pageName(k))}</div><h1 class="page-title">${esc(k==='home'?'Escribe un libro con oficio.':pageName(k))}</h1><p class="lead">${desc}</p>`}
function projectReady(){return !!(state.project.title&&state.project.genre&&state.project.audience)}
function stageList(){return `<div class="step-list">${stages.map(([id,n,name,desc])=>{let tasks=Object.keys(state.tasks).filter(k=>k.startsWith(id+':'));let complete=tasks.length>0&&tasks.every(k=>state.tasks[k]);return `<div class="step"><div class="step-number">${n.slice(1)}</div><div><h3>${esc(name)}</h3><p>${esc(desc)}</p></div><span class="pill ${complete?'done':''}">${complete?'✓ Etapa revisada':'En proceso'}</span></div>`}).join('')}</div>`}

cargos; modelo de voz automatizado pendiente'],['Entrevistarte e integrar tus historias reales sin inventar datos','Requiere flujo de entrevista, citas de audio/transcripción y confirmación factual'] ]},{title:'Series, continuidad y mundo narrativo',items:[['Series de libros con una biblia compartida entre volúmenes','Ahora: biblia por proyecto; vincular y compartir canon entre volúmenes pendiente'],['Mapa de personajes y relaciones, retratos de referencia y arcos por volumen','Ahora: fichas, relaciones y arcos; retratos visuales e integración entre volúmenes pendiente'],['Comprobar cada capítulo contra la biblia de la serie','Ahora: mapa literal de presencia/coaparición; revisión semántica con evidencia sigue pendiente'] ]},{title:'Otros formatos y nuevas ediciones',items:[['Crear ediciones traducidas del libro terminado','Requiere traducción asistida, glosario y revisión humana bilingüe'],['Preparar audiolibro narrado a partir del manuscrito','Requiere voz/TTS o estudio, licencias y revisión de pronunciación'],['Convertir grabaciones y podcasts en libro','Requiere transcripción, atribución de voces y verificación de hechos'] ]},{title:'IA y privacidad',items:[['Usar IA gratuita cuando esté disponible o modelos locales como Ollama','Diseño posible; disponibilidad, cuotas y calidad cambian; $0 no se puede garantizar'],['Aplicación de escritorio para Mac y Windows con archivos en tu equipo','Objetivo de arquitectura; esta versión es un HTML local en navegador'],['Usar tus notas, fuentes y archivos como base documental de la IA','Requiere importación, búsqueda local y citas hacia el material de origen'],['Historial de versiones por capítulo y restauración con un clic','Ahora: guardar/restaurar instantáneas manuales'] ]}];return `${pageIntro('scope','Ya incorporé el alcance de las cuatro imágenes al proyecto. Esta pantalla separa lo que el prototipo hace hoy de lo que falta construir: no presenta como terminadas funciones que aún requieren motores, servicios o pruebas.')}

function field(label,key,value,opts={}){let tag=opts.tag||'input';let attr=opts.attr||'';let hint=opts.hint?`<span class="hint">${opts.hint}</span>`:'';return `<div class="field ${opts.full?'full':''}"><label>${label}</label>${tag==='textarea'?`<textarea data-bind="${key}" ${attr} spellcheck="true">${esc(value||'')}</textarea>`:`<input data-bind="${key}" value="${esc(value||'')}" ${attr}>`}${hint}</div>`}
function selectField(label,key,value,options){return `<div class="field"><label>${label}</label><select data-bind="${key}">${options.map(o=>`<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}
function concept(){const p=state.project;return `${pageIntro('concept','Define la intención, el lector y la promesa. Una propuesta clara orienta cada decisión posterior: estructura, tono, extensión, diseño y lanzamiento.')}
<div class="card"><div class="form-grid">${field('Título de trabajo','project.title',p.title)}${field('Autor / seudónimo','project.author',p.author)}${selectField('Género o tipo de obra','project.genre',p.genre,['Novela','Cuento','Poesía','Ensayo','Memorias','Biografía','Libro infantil','No ficción práctica','Divulgación','Académico','Guía / manual','Otro'])}${field('Idioma y variante','project.language',p.language)}${field('Lector ideal','project.audience',p.audience,{full:true,tag:'textarea',hint:'No basta “todo el mundo”: describe necesidades, contexto, conocimientos previos y qué busca este lector.'})}${field('Promesa central en una frase','project.promise',p.promise,{full:true,tag:'textarea',hint:'¿Qué experiencia, comprensión o transformación concreta puede esperar quien lo lea?'})}${field('Objetivo del libro','project.objective',p.objective,{full:true,tag:'textarea',hint:'¿Por qué debe existir este libro ahora? ¿Qué aporta que no esté resuelto por otras obras?'})}</div><div class="toolbar"><button class="btn primary" data-action="copy-prompt" data-prompt="concept">Pedir una evaluación editorial a Zapia</button></div></div>
<div class="grid two" style="margin-top:16px"><article class="card"><h3>Prueba de propuesta</h3><p class="smalltext">Una propuesta fuerte es específica, demostrable y atractiva para un lector real.</p>${rating('differentiation','Diferenciación','¿Se entiende qué hace distinta a esta obra?')}${rating('reader_need','Necesidad del lector','¿La promesa responde a una necesidad o deseo concreto?')}${rating('credibility','Credibilidad','¿El autor o la investigación pueden sostener la promesa?')}${rating('scope','Alcance','¿El proyecto cabe en un libro con foco, sin abarcarlo todo?')}</article><article class="card"><h3>Análisis de impacto potencial</h3><p class="smalltext">Señales editoriales para analizar, no una predicción de ventas.</p>${rating('timeliness','Pertinencia','¿Conecta con una conversación o necesidad vigente?')}${rating('resonance','Resonancia','¿Deja una idea, emoción o herramienta memorable?')}${rating('accessibility','Accesibilidad','¿Puede comprenderse sin rebajar la complejidad?')}${rating('reach','Alcance','¿Hay comunidades o canales identificables para encontrar lectores?')}<div class="notice" style="margin-top:12px">No existe una fórmula verificable para “fabricar” un bestseller. Priorizamos valor, calidad, lectores y distribución.</div></article></div>`}

const integrityChecks=[['inventory','Identifiqué qué ideas, citas, datos, imágenes y materiales externos aparecen en la obra.'],['citations','Distinguí cita textual, paráfrasis y análisis propio; las citas llevan localizador y atribución.'],['chapter_links','Vinculé las fuentes registradas con los capítulos donde se usan y anoté qué afirmación respaldan.'],['permissions','Revisé licencias o permisos para imágenes, letras, tablas, fragmentos y materiales de terceros.'],['originality','Revisé coincidencias relevantes contra las fuentes originales; una coincidencia no prueba plagio ni su ausencia.'],['author_contribution','Dejé registro de mi análisis, observaciones, decisiones creativas y aportes propios por capítulo.'],['ai_disclosure','Anoté el apoyo de IA o colaboradores y consultaré la política oficial de divulgación del canal elegido.'],['privacy','Tengo autorización para publicar testimonios, datos personales, fotografías o historias identificables.'],['factcheck','Verifiqué nombres, fechas, citas y cifras de riesgo con fuentes primarias cuando fue posible.']];
const stagesTasks={development:[['dev_structure','El orden de capítulos construye un recorrido y evita repeticiones.'],['dev_logic','Las ideas centrales, personajes o instrucciones mantienen coherencia.'],['dev_gaps','He localizado vacíos, contradicciones, simplificaciones y afirmaciones débiles.'],['dev_reader','Una lectura de prueba ha identificado confusiones y pasajes que pierden interés.']],line:[['line_voice','La voz y el registro son consistentes con el lector y el género.'],['line_grammar','Se revisaron gramática, ortografía, puntuación y concordancia.'],['line_terms','Nombres, fechas, siglas, transliteraciones y términos mantienen consistencia.'],['line_proof','Se hizo corrección final sobre pruebas maquetadas, no solo en pantalla.']],production:[['prod_cover','La cubierta comunica género, título y nivel de calidad con jerarquía legible.'],['prod_interior','La composición interior es legible, consistente y adecuada al formato.'],['prod_metadata','Título, subtítulo, autor, descripción, categorías y palabras clave están revisados.'],['prod_isbn','Se definió ISBN/barcode según el país, formato, editorial y canal de distribución.'],['prod_proof','Se revisaron pruebas finales impresas o digitales antes de liberar.']],release:[['rel_rules','Consulté los requisitos vigentes del canal/editorial en la fecha de entrega.'],['rel_files','El formato, tamaño, cubierta, tipografías, sangrías e imágenes cumplen sus especificaciones.'],['rel_rights','Confirmé titularidad, permisos, contratos, territorios y declaraciones requeridas.'],['rel_access','Revisé accesibilidad, legibilidad, enlaces, navegación y metadatos del archivo.'],['rel_plan','Definí lector objetivo, canales, calendario, presupuesto y medición de lanzamiento.']]};
function sourceStatusLabel(status){return ({pending:'Por verificar',consulted:'Consultada',verified:'Verificada por mí',excluded:'Descartada'})[status]||'Por verificar'}
function sourceReference(s){const parts=[];if(s.title)parts.push(s.title.trim());if(s.year)parts.push(`(${s.year.trim()})`);if(s.publication)parts.push(s.publication.trim());if(s.identifier)parts.push(s.identifier.trim());if(s.url)parts.push(s.url.trim());return parts.join('. ')||'Referencia pendiente de completar'}
function sourceChapterLinks(s,i){const linked=Array.isArray(s.chapterIds)?s.chapterIds:[];return state.chapters.length?`<div class="source-chapter-list">${state.chapters.map((c,j)=>`<label><input type="checkbox" data-source-chapter="${i}" data-chapter-id="${esc(c.id||'chapter-'+j)}" ${linked.includes(c.id||'chapter-'+j)?'checked':''}><span>${esc(c.title||'Capítulo '+(j+1))}</span></label>`).join('')}</div>`:'<p class="smalltext">Crea capítulos para vincular esta fuente con su ubicación en el libro.</p>'}function sourceCard(s,i){const status=s.status||'pending';return `<details class="source-card"><summary><span class="source-name">${esc(s.title||'Referencia por completar')}</span><span class="pill ${status==='verified'?'done':status==='excluded'?'':'warning'}">${sourceStatusLabel(status)}</span></summary><div class="source-fields"><div class="form-grid"><div class="field full"><label>Autor y título, tal como aparecen en la fuente</label><input data-source="${i}" data-key="title" placeholder="Autoría. Título del libro, artículo o documento" value="${esc(s.title||'')}"></div><div class="field"><label>Año de publicación</label><input data-source="${i}" data-key="year" placeholder="Año o s. f." value="${esc(s.year||'')}"></div><div class="field"><label>Editorial, revista u organización</label><input data-source="${i}" data-key="publication" placeholder="Editorial / medio / institución" value="${esc(s.publication||'')}"></div><div class="field"><label>DOI, ISBN u otro identificador</label><input data-source="${i}" data-key="identifier" placeholder="DOI, ISBN, archivo" value="${esc(s.identifier||'')}"></div><div class="field"><label>URL</label><input data-source="${i}" data-key="url" placeholder="https://…" value="${esc(s.url||'')}"></div><div class="field"><label>Página, sección o marca de tiempo</label><input data-source="${i}" data-key="locator" placeholder="pp. 18–20 / cap. 3 / 00:14:22" value="${esc(s.locator||'')}"></div><div class="field"><label>Fecha de consulta (si aplica)</label><input type="date" data-source="${i}" data-key="accessed" value="${esc(s.accessed||'')}"></div><div class="field"><label>Estado de revisión (manual)</label><select data-source="${i}" data-key="status"><option value="pending" ${status==='pending'?'selected':''}>Por verificar</option><option value="consulted" ${status==='consulted'?'selected':''}>Consultada</option><option value="verified" ${status==='verified'?'selected':''}>Verificada por mí</option><option value="excluded" ${status==='excluded'?'selected':''}>Descartada</option></select></div><div class="field full"><label>Capítulos donde se usa esta fuente</label>${sourceChapterLinks(s,i)}<p class="smalltext">Relaciona la referencia con los capítulos que la citan o utilizan. El vínculo es una anotación manual.</p></div><div class="field full"><label>Cita textual exacta (solo si piensas usarla)</label><textarea data-source="${i}" data-key="quote" placeholder="Copia el fragmento exacto entre comillas y conserva página o sección arriba.">${esc(s.quote||'')}</textarea></div><div class="field full"><label>Paráfrasis redactada por ti (si aplica)</label><textarea data-source="${i}" data-key="paraphrase" placeholder="Explica la idea con tus palabras y compárala con la fuente para evitar calcar su estructura.">${esc(s.paraphrase||'')}</textarea></div><div class="field full"><label>Qué afirmación respalda, cita o limitación observar</label><textarea data-source="${i}" data-key="use" placeholder="Anota el pasaje o la afirmación vinculada y sus límites. Este texto es una nota de trabajo, no una cita verificada.">${esc(s.use||'')}</textarea></div></div><div class="source-meta" style="margin-top:10px"><span><strong>Referencia en salidas:</strong> ${esc(sourceReference(s))}</span></div><div class="toolbar"><button class="btn small" data-action="remove-source" data-index="${i}">Eliminar fuente</button></div></div></details>`}
function sourceChapterTitles(s){const ids=new Set(s.chapterIds||[]);return state.chapters.map((c,i)=>ids.has(c.id||'ch-'+i)?(c.title||'Capítulo '+(i+1)):null).filter(Boolean).join(', ')}function bibliographyText(){return state.sources.map((s,i)=>`${i+1}. ${sourceReference(s)}

function candidateClaims(text){const numeric=/(?:\b\d+(?:[.,]\d+)?\s*%|\b(?:19|20)\d{2}\b|\b\d+\s+(?:personas|casos|años|veces|días|meses|millones|mil|kilómetros|km|kg|dólares|pesos)\b)/iu,attribution=/\b(?:según|de acuerdo con|estudio(?:s)?|investigación|informe|encuesta|censo|estadísticas?|evidencia|datos|reportó|demostró|reveló|identificó|encontró|concluyó|establece|sostiene|afirma|documenta|publicó)\b/iu;const parts=String(text||'').replace(/\r/g,'').split(/(?<=[.!?])\s+|\n+/u).map(x=>x.trim()).filter(x=>x.length>=28);const seen=new Set(),out=[];for(const sentence of parts){const reasons=[];if(numeric.test(sentence))reasons.push('Incluye cifra, porcentaje o fecha');if(attribution.test(sentence))reasons.push('Menciona una fuente, estudio o hallazgo');if(!reasons.length)continue;const key=sentence.toLocaleLowerCase('es-MX').replace(/\s+/g,' ').trim();if(seen.has(key))continue;seen.add(key);out.push({text:sentence,reason:reasons.join('; ')})}return out.slice(0,12)}function normalizeClaimText(text){return String(text||'').toLocaleLowerCase('es-MX').replace(/\s+/g,' ').replace(/[“”"'.,;:!?¿¡]/g,'').trim()}function claimCandidatesFor(c){const all=candidateClaims(c.draft||''),existing=new Set((c.claims||[]).map(x=>normalizeClaimText(x.text)));return{all,fresh:all.filter(x=>!existing.has(normalizeClaimText(x.text)))}}function renderClaimCandidates(i){const c=state.chapters[i];if(!c)return;const box=document.getElementById('claim-suggestions-'+c.id);if(!box)return;const found=claimCandidatesFor(c),candidates=found.fresh;if(!found.all.length)box.innerHTML='<div class="notice"><strong>No encontré candidatas con estas señales.</strong> Esto no significa que todas las afirmaciones estén sustentadas: el análisis es limitado y puedes registrarlas manualmente.</div>';else if(!candidates.length)box.innerHTML='<div class="notice"><strong>Las candidatas detectadas ya están registradas.</strong> Esto no confirma que estén bien sustentadas; revisa cada fuente manualmente.</div>';else box.innerHTML=`<div class="notice"><strong>${candidates.length} frase(s) candidata(s) a documentar.</strong> Señales locales de cifras, fechas o atribuciones; pueden ser falsos positivos y también omitir afirmaciones importantes. Revisa cada una antes de añadirla.</div><div class="suggestion-list">${candidates.map(x=>`<article class="suggestion-card"><p>${esc(x.text)}</p><span class="smalltext">${esc(x.reason)}</span><div class="toolbar"><button class="btn small" data-action="add-suggested-claim" data-index="${i}" data-suggestion="${esc(x.text)}" data-reason="${esc(x.reason)}">Registrar para revisar</button></div></article>`).join('')}</div>`;box.classList.remove('hidden');const panel=box.closest('details');if(panel)panel.open=true;box.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>action(b)));box.scrollIntoView({block:'nearest',behavior:'smooth'})}function claimStatusLabel(status){return ({pending:'Por comprobar',sourced:'Fuente asociada; falta contrastar',verified:'Contrastada por mí',unsupported:'Sin respaldo encontrado'})[status]||'Por comprobar'}function claimEvidencePanel(c,i){const claims=Array.isArray(c.claims)?c.claims:[],pending=claims.filter(x=>x.status!=='verified').length;return `<details class="claims-panel"><summary><strong>Mapa de afirmaciones y evidencia</strong><span class="pill ${pending?'warning':'done'} claim-summary-pill">${claims.length?pending+' por confirmar':'Sin registros'}</span></summary><p class="smalltext">Puedes registrar afirmaciones manualmente o pedir candidatas con señales superficiales (cifras, fechas y atribuciones). La sugerencia se calcula en este navegador, sin enviar el borrador. No es un análisis semántico: tú decides qué requiere fuente y si la evidencia lo respalda.</p><div id="claim-suggestions-${esc(c.id)}" class="claim-suggestions hidden"></div><div class="claim-list">${claims.length?claims.map((cl,j)=>{const status=cl.status||'pending',hasSource=state.sources.some(s=>s.id===cl.sourceId),options=`<option value="">Sin fuente asociada</option>${cl.sourceId&&!hasSource?`<option value="${esc(cl.sourceId)}" selected>Fuente eliminada o no disponible</option>`:''}${state.sources.map(s=>`<option value="${esc(s.id)}" ${cl.sourceId===s.id?'selected':''}>${esc(s.title||'Referencia por completar')}</option>`).join('')}`;return `<article class="claim-card"><div class="field full"><label>Afirmación o fragmento exacto del capítulo</label><textarea data-claim-field="${i}" data-claim-index="${j}" data-claim-key="text" placeholder="Copia la frase del borrador o formula con precisión la afirmación verificable…">${esc(cl.text||'')}</textarea></div><div class="claim-grid"><div class="field"><label>Fuente registrada</label><select data-claim-field="${i}" data-claim-index="${j}" data-claim-key="sourceId">${options}</select></div><div class="field"><label>Localizador</label><input data-claim-field="${i}" data-claim-index="${j}" data-claim-key="locator" placeholder="Página, sección, tabla o tiempo" value="${esc(cl.locator||'')}"></div></div><div class="field full"><label>Pasaje exacto de evidencia en la fuente</label><textarea data-claim-field="${i}" data-claim-index="${j}" data-claim-key="evidenceQuote" placeholder="Copia el pasaje que apoya la afirmación; confirma su contexto y permisos.">${esc(cl.evidenceQuote||'')}</textarea></div><div class="claim-grid"><div class="field"><label>Estado de revisión manual</label><select class="claim-status" data-claim-field="${i}" data-claim-index="${j}" data-claim-key="status"><option value="pending" ${status==='pending'?'selected':''}>Por comprobar</option><option value="sourced" ${status==='sourced'?'selected':''}>Fuente asociada; falta contrastar</option><option value="verified" ${status==='verified'?'selected':''}>Contrastada por mí</option><option value="unsupported" ${status==='unsupported'?'selected':''}>Sin respaldo encontrado</option></select></div><div class="field"><label>Qué respalda, qué no y qué falta</label><textarea data-claim-field="${i}" data-claim-index="${j}" data-claim-key="note" placeholder="Anota límites, matices, dudas o una fuente adicional pendiente…">${esc(cl.note||'')}</textarea></div></div><div class="toolbar"><button class="btn small" data-action="remove-claim" data-chapter-index="${i}" data-claim-index="${j}">Eliminar registro</button></div></article>`}).join(''):'<div class="empty"><strong>Aún no hay afirmaciones registradas</strong>Añade frases o datos concretos que deban sustentarse; no se analiza automáticamente todo el capítulo.</div>'}</div><div class="toolbar"><button class="btn small" data-action="add-claim" data-index="${i}">+ Registrar afirmación</button><button class="btn small" data-view="research">Abrir registro de fuentes</button></div></details>`}function chapterList(editable){if(!state.chapters.length)return '<div class="empty"><strong>El mapa está vacío</strong>Añade capítulos o crea una estructura base de referencia.</div>';return state.chapters.map((c,i)=>`<div class="chapter-row"><div class="step-number">${String(i+1).padStart(2,'0')}</div><div><input data-chapter="${i}" data-key="title" placeholder="Título del capítulo" value="${esc(c.title||'Capítulo '+(i+1))}"><div class="chapter-meta">${wc(c.draft||'').toLocaleString('es-MX')} palabras · ${esc(c.status||'Esquema')}</div>${editable?`<div class="field" style="margin-top:7px"><input data-chapter="${i}" data-key="purpose" placeholder="Función / idea central del capítulo" value="${esc(c.purpose||'')}"></div><textarea data-chapter="${i}" data-key="draft" placeholder="Escribe aquí el borrador del capítulo…" spellcheck="true">${esc(c.draft||'')}</textarea><div class="toolbar"><button class="btn small" data-action="review-chapter" data-index="${i}">Revisión preliminar</button><button class="btn small" data-action="suggest-claims" data-index="${i}" title="Sugiere posibles afirmaciones verificables; no detecta plagio ni determina si necesitan cita.">Sugerir afirmaciones</button><button class="btn small" data-action="copy-prompt" data-prompt="chapter" data-index="${i}">Solicitar edición</button><button class="btn small" data-action="save-version" data-index="${i}">Guardar versión</button><button class="btn small" data-action="show-versions" data-index="${i}">Historial (${(c.versions||[]).length})</button><span class="kpi-tag" id="wc-${c.id}">${wc(c.draft||'')} palabras</span></div><div id="review-${c.id}"></div><details class="feedback-panel"><summary><strong>Retroalimentación y decisiones</strong><span class="pill">${esc(c.feedbackDecision==='apply'?'La atenderé':c.feedbackDecision==='defer'?'Pospuesta':c.feedbackDecision==='declined'?'No la aplicaré':'Pendiente')}</span></summary><p class="smalltext">Pega aquí la devolución de Zapia, un editor o un lector. Estas notas se guardan aparte y no entran al manuscrito exportado.</p><div class="field"><label>Observaciones y evidencia</label><textarea data-chapter="${i}" data-key="feedbackNotes" placeholder="Fortalezas, dudas y observaciones con citas o ubicación en el capítulo…">${esc(c.feedbackNotes||'')}</textarea></div><div class="field" style="margin-top:9px"><label>Qué decidí hacer</label><textarea data-chapter="${i}" data-key="feedbackActions" placeholder="Anota las acciones que tú aceptas, pospones o descartas…">${esc(c.feedbackActions||'')}</textarea></div><div class="field" style="margin-top:9px"><label>Decisión del autor</label><select data-feedback-choice="${i}"><option value="" ${!c.feedbackDecision?'selected':''}>Pendiente</option><option value="apply" ${c.feedbackDecision==='apply'?'selected':''}>La atenderé</option><option value="defer" ${c.feedbackDecision==='defer'?'selected':''}>Posponer</option><option value="declined" ${c.feedbackDecision==='declined'?'selected':''}>No la aplicaré</option></select></div><p class="footer-note">Guarda una versión antes de modificar el borrador. La devolución no es un veredicto automático.</p></details><details class="provenance-panel"><summary><strong>Procedencia y aporte del autor</strong><span class="pill">Registro de trabajo</span></summary><p class="smalltext">Anota de dónde vienen las ideas y qué decisiones son tuyas. No incluyas una vivencia como propia si no lo es; estos datos documentan el proceso, pero no certifican autoría ni originalidad.</p><div class="field"><label>Origen de ideas y materiales</label><textarea data-chapter="${i}" data-key="originNotes" placeholder="Experiencia o memoria propia, observaciones, entrevistas, lecturas, investigación u otros materiales…">${esc(c.originNotes||'')}</textarea></div><div class="field" style="margin-top:9px"><label>Qué aportas tú</label><textarea data-chapter="${i}" data-key="authorContribution" placeholder="Tu análisis, interpretación, preguntas, ejemplos, contraargumentos o decisiones creativas…">${esc(c.authorContribution||'')}</textarea></div><div class="field" style="margin-top:9px"><label>Uso de IA o colaboradores</label><textarea data-chapter="${i}" data-key="aiAssistance" placeholder="Herramienta o colaborador, tarea, parte afectada, qué conservaste o cambiaste y cómo lo revisaste. Escribe “ninguno” si no aplica…">${esc(c.aiAssistance||'')}</textarea></div><p class="footer-note">Una voz propia surge de lo que realmente observas, preguntas, analizas y decides; no de intentar engañar a un detector.</p></details>${claimEvidencePanel(c,i)}`:`<div class="chapter-meta">${esc(c.purpose||'Propósito pendiente')}</div>`}</div><button class="icon-x" title="Eliminar capítulo" data-action="remove-chapter" data-index="${i}">×</button></div>`).join('')}

<div class="grid two"><article class="card"><h2>Lectura estructural</h2>${checksGroup('development')}<div class="toolbar"><button class="btn primary" data-action="copy-prompt" data-prompt="development">Encargar una lectura crítica a Zapia</button></div></article><article class="card"><h2>Informe editorial</h2><p class="smalltext">Registra observaciones y decisiones. Pega aquí dictámenes, lecturas beta o notas de edición.</p>${field('Diagnóstico global','notes.development',state.notes.development,{tag:'textarea',full:true,hint:'Separar: fortalezas, problemas prioritarios, evidencia textual, recomendación y dudas para el autor.'})}<div class="toolbar"><button class="btn" data-action="download-report" data-report="development">Guardar informe de lectura</button></div></article></div>`}
function line(){return `${pageIntro('line','Revisamos claridad, ritmo, repetición, tono, gramática, ortografía y puntuación. Primero se cierra la edición de fondo; la prueba tipográfica final va después de maquetar.')}
<div class="grid two"><article class="card"><h2>Control de estilo</h2>${checksGroup('line')}<div class="toolbar"><button class="btn primary" data-action="copy-prompt" data-prompt="line">Encargar corrección de estilo a Zapia</button></div></article><article class="card"><h2>Guía de voz y estilo</h2><p class="smalltext">Guarda un perfil de voz por proyecto o seudónimo. Se adjunta a los encargos editoriales que copies, sin enviar nada automáticamente.</p>${field('Seudónimo / perfil','notes.penname',state.notes.penname)}${field('Muestra de escritura autorizada','notes.voiceSample',state.notes.voiceSample,{tag:'textarea',full:true,hint:'Unos párrafos propios para orientar tono y ritmo. Se conserva solo en este navegador y se incluye en el encargo solo si decides copiarlo.'})}${field('Tono y voz','notes.voice',state.notes.voice,{tag:'textarea',full:true,hint:'Ejemplo: ensayo narrativo, primera persona, cercano pero riguroso; evitar jerga sin explicar.'})}${field('Decisiones de estilo','notes.styleguide',state.notes.styleguide,{tag:'textarea',full:true,hint:'Nombres, mayúsculas, términos preferidos, uso de cursivas, cifras, citas y variantes regionales.'})}<button class="btn small" data-action="copy-prompt" data-prompt="styleguide">Generar guía inicial con Zapia</button></article></div><div class="notice" style="margin-top:16px">El sistema puede preparar encargos y registrar decisiones, pero una corrección real exige revisar el texto completo con contexto. No se reemplaza automáticamente ningún pasaje sin autorización del autor.</div>`}
function check(id,text){return `<label class="check"><input type="checkbox" data-task="${esc(id)}" ${state.tasks[id]?'checked':''}><span>${esc(text)}</span></label>`}
function integrity(){const claims=state.chapters.flatMap(c=>c.claims||[]),withoutSource=claims.filter(c=>!c.sourceId||!state.sources.some(s=>s.id===c.sourceId)).length,notChecked=claims.filter(c=>c.status!=='verified').length;return `${pageIntro('integrity','Documenta la procedencia de ideas, fuentes y herramientas; conserva separado lo que verificaste y lo que todavía es una hipótesis.')}
<div class="notice" style="margin-bottom:16px"><strong>La trazabilidad ayuda a reducir riesgos, pero no certifica originalidad.</strong> Libro Maestro no puede determinar quién escribió un fragmento ni detectar todas las coincidencias. Un resultado de similitud es una pista: abre la fuente, compara el pasaje y su contexto y decide con criterio humano. No existe una fórmula técnica para “hacer que parezca humano”; el objetivo es que tus preguntas, observaciones, análisis y decisiones reales conduzcan el libro.</div><div class="stats"><div class="stat"><strong>${claims.length}</strong><span>Afirmaciones registradas manualmente</span></div><div class="stat"><strong>${withoutSource}</strong><span>Sin fuente asociada</span></div><div class="stat"><strong>${notChecked}</strong><span>No marcadas como contrastadas</span></div></div><p class="smalltext">El contador cubre solo lo que registraste. Las sugerencias revisan patrones simples (cifras, fechas y atribuciones), pueden omitir afirmaciones y no detectan plagio.</p><div class="grid two"><article class="card"><h2>Protocolo de integridad</h2><p class="smalltext">Marca solo lo que ya comprobaste. Si no aplica, anótalo con una justificación.</p><div class="checklist">${integrityChecks.map(([k,t])=>check('integrity:'+k,t)).join('')}</div><div class="toolbar"><button class="btn primary" data-action="copy-prompt" data-prompt="integrity">Preparar auditoría de fichas</button><button class="btn" data-action="prepare-integrity-chapter">Auditar un capítulo con su texto</button><button class="btn" data-action="export-provenance">Descargar informe de trazabilidad (.md)</button></div><p class="smalltext">“Auditoría de fichas” incluye solo el registro manual, no los borradores. Para revisar frases concretas, elige un capítulo: se copiará únicamente ese borrador y sus registros. Nada se envía hasta que tú pegues el texto en un servicio.</p></article><article class="card"><h2>Declaración de proceso y derechos</h2><p class="smalltext">Registra herramientas, colaboradores, materiales licenciados, permisos, titularidad y restricciones conocidas.</p>${field('Declaración / notas de derechos','notes.rights',state.notes.rights,{tag:'textarea',full:true,hint:'Anota quién hizo qué, herramientas de IA utilizadas, permisos, licencias y condiciones que aún falte comprobar.'})}<div class="notice red" style="margin-top:13px"><strong>Alcance de esta versión:</strong> no consulta bases de similitud ni certifica autoría. La revisión externa puede implicar pago y exponer el texto a un tercero; antes de conectar un servicio habrá que revisar su privacidad, coste y condiciones. Revisa además la política oficial y vigente de KDP antes de publicar.</div><div class="toolbar"><button class="btn small" data-action="copy-prompt" data-prompt="integrity">Copiar fichas para revisión humana</button><button class="btn small" data-view="research">Ir al registro de fuentes</button></div></article></div>`}
function estimatePages(){const words=totalWords(),pr=state.production||defaults().production,profile=(pr.profile||'').toLowerCase(),trim=pr.trim||'';if(profile.includes('ebook')||profile.includes('digital')||trim.includes('sin página'))return 0;const per=trim.includes('A5')?360:trim.includes('5 × 8')?300:330;return words?Math.max(1,Math.ceil(words/per)):0}
function production(){let p=state.project,pr=state.production||defaults().production;return `${pageIntro('production','El libro también es un objeto. Aquí defines una ficha de producción, estimas su extensión y preparas una salida de lectura antes de enviar el manuscrito a una maquetación profesional.')}
<div class="grid two"><article class="card"><h2>Ficha técnica de producción</h2><div class="form-grid">${field('Título','project.title',p.title)}${field('Autor','project.author',p.author)}${field('Subtítulo','project.coverSubtitle',p.coverSubtitle,{full:true})}${field('Color de cubierta','project.color',p.color,{attr:'type="color"'})}${selectField('Perfil de salida','production.profile',pr.profile,['Impreso 6 × 9','Impreso 5 × 8','Impreso A5','Ebook reflowable','Lectura digital'])}${selectField('Tamaño','production.trim',pr.trim,['6 × 9 pulgadas','5 × 8 pulgadas','A5','Reflowable / sin página fija'])}${selectField('Papel','production.paper',pr.paper,['Blanco','Crema','No aplica: ebook'])}${selectField('Tipografía interior','production.font',pr.font,['Garamond','Georgia','Palatino','Serif clásica','Sans serif'])}${field('Descripción editorial','production.description',pr.description,{full:true,tag:'textarea',hint:'Texto de venta pendiente de verificar: no prometas resultados que el libro no pueda sostener.'})}${field('Palabras clave / categorías','production.keywords',pr.keywords,{full:true,hint:'Registra decisiones para revisar después contra las categorías y políticas del canal.'})}</div><div class="toolbar"><button class="btn" data-action="print">Imprimir cubierta conceptual</button><button class="btn" data-action="export-print">Vista para PDF</button><button class="btn" data-action="export-docx">DOCX</button><button class="btn" data-action="export-epub">EPUB</button><button class="btn primary" data-action="copy-prompt" data-prompt="cover">Pedir propuesta visual a Zapia</button></div></article><article class="card"><h2>Vista preliminar y extensión</h2><div class="cover-wrap"><div class="book-cover" id="cover-preview" style="background:${esc(p.color||'#403653')}"><small class="cover-kicker">${esc(p.genre||'Libro')}</small><strong>${esc(p.title||'Título del libro')}</strong><em>${esc(p.coverSubtitle||'Subtítulo')}</em><span>${esc(p.author||'Nombre del autor')}</span></div><div class="cover-details"><div class="stats" style="grid-template-columns:1fr 1fr;margin:0 0 12px"><div class="stat"><strong>${totalWords().toLocaleString('es-MX')}</strong><span>Palabras actuales</span></div><div class="stat"><strong>${estimatePages()||'—'}</strong><span>Páginas estimadas</span></div></div><div class="notice">La estimación orienta el proyecto. El número final depende de maquetación, tamaño, tipografía, imágenes y secciones. No sustituye la plantilla oficial del canal ni calcula todavía el lomo.</div><div style="margin-top:13px">${checksGroup('production')}</div></div></div></article></div><div class="card" style="margin-top:16px"><h2>Salida editorial actual</h2><p class="smalltext">DOCX y EPUB se comprueban internamente como paquetes ZIP/XML y se verifica que incluyan el texto del proyecto; aún falta abrirlos en Word o un lector de libros y validar su apariencia. Para PDF se usa la impresión del navegador y falta revisar un PDF guardado. Ninguna de estas salidas es todavía un archivo profesional de imprenta.</p><div class="toolbar"><button class="btn primary" data-action="export-print">PDF vía imprimir</button><button class="btn" data-action="export-docx">Descargar DOCX</button><button class="btn" data-action="export-epub">Descargar EPUB</button><button class="btn" data-action="copy-prompt" data-prompt="production">Preparar especificación de maquetación</button></div></div>`}
const publishNotes={"Autopublicación":'Consulta la guía vigente del proveedor elegido: formatos aceptados, sangrías, fuentes, cubierta, ISBN, metadatos, derechos, contenido prohibido, impuestos y territorios.',"Amazon KDP":'Verifica la guía oficial vigente de KDP para formatos, cubierta, contenido, derechos, metadatos, ISBN y declaraciones de contenido asistido por IA. Las especificaciones cambian.',"IngramSpark":'Consulta las especificaciones actuales de IngramSpark para interiores, cubierta, sangrado, ISBN, archivos, distribución, derechos y costes.',"Editorial tradicional":'Cada sello establece sus propias normas de recepción, propuesta, muestra, representación, derechos y formatos; no hay un checklist universal.',"Otro canal":'Anota el canal, país y formato y consulta su centro de ayuda oficial antes del envío.'};
function release(){return `${pageIntro('release','Cierra el manuscrito con controles editoriales y contrasta las reglas vigentes del destino. Este checklist organiza la preparación; no es aprobación legal ni certificación de una plataforma.')}
<div class="grid two"><article class="card"><h2>Destino de publicación</h2>${selectField('Canal / ruta','platform',state.platform||'Autopublicación',Object.keys(publishNotes))}<div class="notice" style="margin:13px 0">${esc(publishNotes[state.platform||'Autopublicación'])}</div><div class="field"><label>Enlace oficial de requisitos consultados</label><input data-bind="notes.publishingUrl" value="${esc(state.notes.publishingUrl||'')}" placeholder="Pega aquí el enlace oficial revisado"></div><div class="field" style="margin-top:12px"><label>Fecha de verificación / notas</label><textarea data-bind="notes.publishingRules" placeholder="País, formato, versión de requisitos, excepciones y dudas legales">${esc(state.notes.publishingRules||'')}</textarea></div></article><article class="card"><h2>Checklist de salida</h2>${checksGroup('release')}<div class="toolbar"><button class="btn primary" data-action="copy-prompt" data-prompt="release">Revisar paquete editorial con Zapia</button></div></article></div>
<div class="grid two" style="margin-top:16px"><article class="card"><h2>Panel de preparación</h2><div class="score">${readiness()}%</div><div class="progress"><i style="width:${readiness()}%"></i></div><p class="smalltext">Porcentaje de casillas marcadas del proyecto. No equivale a probabilidad de éxito, calidad certificada ni aceptación editorial.</p><div class="toolbar"><button class="btn" data-action="export-md">Exportar manuscrito</button><button class="btn" data-action="export-json">Respaldar proyecto completo</button></div></article><article class="card"><h2>Datos que aún requieren decisión humana</h2><div class="checklist">${[['finalhuman','Última lectura en pruebas reales (impresión o dispositivo).'],['contracts','Contratos, licencias, ISBN, impuestos y titularidad revisados para la jurisdicción.'],['proofread','Un lector competente, corrector o editor independiente aprobó el archivo final.'],['distribution','Distribución y lanzamiento cuentan con calendario, presupuesto y responsables.']].map(([k,t])=>check('release:'+k,t)).join('')}</div></article></div><div class="footer-note">Las normas específicas de publicación se deben comprobar en fuentes oficiales actualizadas al momento de subir cada formato. Si hay contratos, derechos, privacidad o impuestos, solicita asesoría competente para el país correspondiente.</div>`}
function integrityAuditMaterial(){const rows=[`Proyecto: ${state.project.title||'Sin título'}`];state.chapters.forEach((c,i)=>{rows.push(`\nCAPÍTULO ${i+1}: ${c.title||'Sin título'}`);rows.push(`Origen / aporte / IA: ${c.originNotes||'Sin registrar.'} | ${c.authorContribution||'Sin registrar.'} | ${c.aiAssistance||'Sin registrar.'}`);const claims=c.claims||[];if(!claims.length)rows.push('Afirmaciones: ninguna registrada manualmente; no inferir que no haya afirmaciones que requieran fuente.');claims.forEach((cl,j)=>{const source=state.sources.find(s=>s.id===cl.sourceId);rows.push(`Afirmación ${j+1}: ${cl.text||'Sin transcribir.'} | Estado manual: ${claimStatusLabel(cl.status||'pending')} | Fuente: ${source?sourceReference(source):'Sin fuente asociada'} | Localizador: ${cl.locator||source?.locator||'Sin registrar'} | Evidencia literal: ${cl.evidenceQuote||'Sin registrar'} | Nota: ${cl.note||'Sin registrar'}`)})});rows.push('\nFUENTES REGISTRADAS:');if(!state.sources.length)rows.push('Ninguna.');state.sources.forEach((s,i)=>rows.push(`${i+1}. ${sourceReference(s)} | estado manual: ${sourceStatusLabel(s.status||'pending')} | capítulos: ${sourceChapterTitles(s)||'ninguno anotado'} | localizador: ${s.locator||'sin registrar'} | cita: ${s.quote||'sin registrar'} | paráfrasis: ${s.paraphrase||'sin registrar'} | uso/límites: ${s.use||'sin registrar'}`));return rows.join('\n')}function integrityChapterMaterial(i){const c=state.chapters[Number(i)];if(!c)return 'Capítulo no disponible.';const rows=[`CAPÍTULO ${Number(i)+1}: ${c.title||'Sin título'}`,`Origen / aporte / IA: ${c.originNotes||'Sin registrar.'} | ${c.authorContribution||'Sin registrar.'} | ${c.aiAssistance||'Sin registrar.'}`,'BORRADOR COMPLETO DEL CAPÍTULO:',c.draft||'[Este capítulo no tiene borrador guardado.]','AFIRMACIONES REGISTRADAS MANUALMENTE:'];const claims=c.claims||[];if(!claims.length)rows.push('Ninguna registrada manualmente; no inferir que no haya afirmaciones que requieran fuente.');claims.forEach((cl,j)=>{const source=state.sources.find(s=>s.id===cl.sourceId);rows.push(`${j+1}. ${cl.text||'Sin transcribir.'} | Estado: ${claimStatusLabel(cl.status||'pending')} | Fuente: ${source?sourceReference(source):'Sin fuente asociada'} | Localizador: ${cl.locator||source?.locator||'Sin registrar'} | Evidencia: ${cl.evidenceQuote||'Sin registrar'} | Nota: ${cl.note||'Sin registrar'}`)});rows.push('FUENTES REGISTRADAS EN EL PROYECTO (la inclusión no implica vínculo con este capítulo):');if(!state.sources.length)rows.push('Ninguna.');state.sources.forEach((s,j)=>rows.push(`${j+1}. ${sourceReference(s)} | Localizador: ${s.locator||'sin registrar'} | Capítulos anotados: ${sourceChapterTitles(s)||'ninguno'} | Cita: ${s.quote||'sin registrar'} | Paráfrasis: ${s.paraphrase||'sin registrar'} | Uso/límites: ${s.use||'sin registrar'}`));return rows.join('\n')}function promptFor(kind,idx){const p=state.project,ch=state.chapters[Number(idx)]||{},b=state.bible||defaults().bible,character=b.characters[Number(idx)]||{};const voiceContext=['line','styleguide','chapter','editorial','development','continuity'].includes(kind)?`\nPerfil de voz aprobado: ${state.notes.voice||'pendiente'}. Seudónimo: ${state.notes.penname||p.author||'pendiente'}. Muestra autorizada por el autor:\n${state.notes.voiceSample||'[sin muestra proporcionada]'}`:'';const base=`Actúa como editor profesional, crítico y riguroso. Trabaja en español de México salvo que el manuscrito indique otro idioma. No inventes citas, datos, autores ni reglas editoriales. Distingue hecho, interpretación y recomendación. No reescribas la voz del autor sin explicar el motivo. Proyecto: “${p.title||'sin título'}”, género ${p.genre||'por definir'}, lector ${p.audience||'por definir'}, promesa: ${p.promise||'por definir'}.${voiceContext}`;const tasks={concept:`Evalúa la propuesta editorial con honestidad. Devuelve síntesis, lector real, problema/promesa, diferenciación a validar, vacíos, riesgos y cinco preguntas difíciles. No prometas ventas ni bestseller.`,research:`Audita fuentes y afirmaciones. Clasifica cada afirmación como verificable, interpretación, pendiente o no sustentada. No fabriques fuentes.`,structure:`Critica el mapa capítulo por capítulo: función, progreso, redundancia, lagunas, ritmo, evidencia y relación con la promesa.`,chapter:`Edita diagnósticamente “${ch.title||''}”, propósito “${ch.purpose||'por definir'}”. Devuelve fortalezas; hasta tres prioridades con cita exacta y ubicación; preguntas para el autor y acciones sugeridas. Distingue hecho, interpretación y recomendación; marca lo que requiere verificación, conserva la voz y no reescribas el capítulo sin permiso. Termina con preguntas concretas para que el autor incorpore análisis, observaciones o ejemplos propios, sin inventar vivencias ni afirmar que un texto es humano o libre de plagio.`,editorial:`Haz un informe de edición de fondo con fortalezas, problemas priorizados, argumento/continuidad, ritmo, redundancias, evidencia e intervenciones accionables. Cita ejemplos y limita tus conclusiones al texto entregado.`,development:`Haz una lectura crítica. Prioriza cinco cambios de mayor impacto con evidencia textual; separa observación, interpretación y recomendación.`,line:`Corrige el fragmento entregado: devuelve versión corregida, cambios relevantes y dudas para el autor. Conserva voz y variante regional; no alteres datos o citas sin marcarlos.`,styleguide:`Formula una guía de estilo provisional para voz, tono, persona, registro, términos, mayúsculas, números, citas, regionalismos y consistencia. Señala decisiones que debe aprobar el autor.`,integrity:`Audita trazabilidad sin certificar originalidad ni atribuir autoría humana o artificial. Identifica citas/paráfrasis sin fuente, afirmaciones y localizadores pendientes, fuentes no vinculadas, permisos, privacidad y uso de IA. Devuelve una tabla por afirmación con capítulo, evidencia disponible, fuente/localizador, tipo de uso (cita, paráfrasis o análisis propio) y comprobación pendiente. No inventes referencias; recomienda cotejar cada coincidencia externa con la fuente original y consultar la política oficial vigente del canal.`,integrityChapter:`Audita SOLO el capítulo completo incluido abajo. Usa fragmentos exactos y ubicaciones por encabezado/párrafo para señalar cada posible cita, paráfrasis o afirmación que requiera cotejo. Distingue lo que el registro sí demuestra de lo que no puede comprobarse con los datos disponibles. No afirmes que una cita carece de fuente en absoluto si solo falta en este registro: marca “fuente no proporcionada para esta revisión”. No inventes fuentes ni localizadores; si falta una página, indica que debe añadirse. Revisa permisos, privacidad y uso de IA sin atribuir autoría ni certificar originalidad. Devuelve una tabla por pasaje con capítulo, fragmento exacto, evidencia disponible, fuente/localizador, tipo de uso y comprobación pendiente; finaliza recomendando cotejar coincidencias con la fuente original y consultar la política oficial vigente del canal.`,cover:`Propón tres rutas visuales originales, jerarquía, tipografía, paleta, metáfora y riesgos de cliché. No copies cubiertas ni prometas ventas; el lomo depende de paginación y plantilla final.`,release:`Prepara preguntas para comprobar elegibilidad en el canal. Usa reglas oficiales proporcionadas o verificables; no inventes requisitos y separa revisión técnica, editorial y legal.`,product:`Diseña fases, criterios de aceptación, dependencias, privacidad, costos y pruebas de Libro Maestro. No presentes lo pendiente como construido ni prometas costo cero o bestseller.`,continuity:`Compara los borradores con la biblia adjunta. Señala discrepancias potenciales con capítulo y cita textual; distingue contradicción, ausencia, dato ambiguo e hipótesis. No inventes ni cambies el canon: pide decisión al autor.`,portrait:`Prepara un prompt de retrato visual del personaje a partir de rasgos confirmados, época, vestuario, emoción y estilo. No añadas atributos físicos o culturales no especificados. Devuelve también una lista de detalles que faltan por aprobar.`};let material='[Pega aquí el material que quieres revisar]';if(kind==='chapter')material=ch.draft||'[Añadir borrador]';else if(kind==='structure')material=state.chapters.map((c,i)=>`${i+1}. ${c.title} — ${c.purpose||'sin propósito definido'}`).join('\n');else if(kind==='continuity')material=`BIBLIA:\n${JSON.stringify(b,null,2)}\n\nCAPÍTULOS:\n${state.chapters.map((c,i)=>`Capítulo ${i+1}: ${c.title}\n${c.draft}`).join('\n\n')}`;else if(kind==='integrity')material=integrityAuditMaterial();else if(kind==='integrityChapter')material=integrityChapterMaterial(idx);else if(kind==='portrait')material=JSON.stringify(character,null,2);return `${base}\n\nTarea: ${tasks[kind]||tasks.editorial}\n\nMaterial del proyecto:\n${material}\n\nEntrega una revisión concreta, en español claro y orientada a mejorar el libro.`}
function saveVersion(i){const c=state.chapters[i];if(!c)return;c.versions=c.versions||[];const latest=c.versions[0];if(latest&&latest.title===c.title&&latest.purpose===c.purpose&&latest.draft===c.draft){showToast('No hay cambios nuevos que guardar');return}c.versions.unshift({at:new Date().toISOString(),title:c.title||'',purpose:c.purpose||'',draft:c.draft||''});c.versions=c.versions.slice(0,30);save();render();showToast('Versión guardada')}
function showVersions(i){const c=state.chapters[i];if(!c)return;const vs=c.versions||[];if(!vs.length){showToast('Todavía no hay versiones guardadas');return}const root=document.getElementById('modal-root');root.innerHTML=`<div class="modal-back"><div class="modal"><div class="eyebrow">Archivo del capítulo</div><h2>Versiones: ${esc(c.title||'Capítulo')}</h2><p class="smalltext">Restaurar conserva la versión actual en el historial antes de reemplazar el borrador.</p><div class="checklist">${vs.map((v,n)=>`<div class="check"><div style="flex:1"><strong>${new Date(v.at).toLocaleString('es-MX')}</strong><small>${wc(v.draft||'')} palabras · ${esc(v.title||'Sin título')}</small></div><button class="btn small" data-restore-version="${n}">Restaurar</button></div>`).join('')}</div><div class="toolbar"><button class="btn" id="close-versions">Cerrar</button></div></div></div>`;root.querySelector('#close-versions').onclick=()=>root.innerHTML='';root.querySelectorAll('[data-restore-version]').forEach(btn=>btn.addEventListener('click',()=>{const saved=vs[Number(btn.dataset.restoreVersion)];if(!saved||!confirm('¿Restaurar esta versión? El estado actual se conservará también en el historial.'))return;c.versions.unshift({at:new Date().toISOString(),title:c.title||'',purpose:c.purpose||'',draft:c.draft||''});c.versions=c.versions.slice(0,30);c.title=saved.title;c.purpose=saved.purpose;c.draft=saved.draft;root.innerHTML='';save();render();showToast('Versión restaurada')}))}
function addChapter(title='',purpose=''){state.chapters.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),title:title||`Capítulo ${state.chapters.length+1}`,purpose,draft:'',status:'Esquema',versions:[]});save();render();showToast('Capítulo añadido')}
function render(){let html=currentView==='home'?home():currentView==='scope'?scope():currentView==='concept'?concept():currentView==='research'?research():currentView==='structure'?structure()+matterEditor():currentView==='bible'?biblePage():currentView==='draft'?draft():currentView==='development'?development():currentView==='line'?line():currentView==='integrity'?integrity():currentView==='production'?production():release();shell(html)}
function updateNested(path,value){const bits=path.split('.');let o=state;for(let i=0;i<bits.length-1;i++){if(!o[bits[i]])o[bits[i]]={};o=o[bits[i]]}o[bits.at(-1)]=value;save()}

function continuityScan(){const out=document.getElementById('continuity-report'),b=state.bible||defaults().bible;if(!out)return;const names=b.characters.filter(c=>c.name&&c.name.trim()),chapters=state.chapters;let html=`<div class="notice green"><strong>Presencia literal por capítulo</strong><small>Coincidencias de nombres registradas; no es detección de contradicciones ni prueba de continuidad.</small></div>`;if(!chapters.length)html+='<p>Añade capítulos para generar el mapa de presencia.</p>';else if(!names.length)html+='<p>Registra personajes para poder localizarlos en los capítulos.</p>';else html+=names.map(ch=>{const found=chapters.map((c,i)=>({...c,i})).filter(c=>(c.draft||'').toLocaleLowerCase().includes(ch.name.toLocaleLowerCase()));return `<div class="check"><span style="flex:1"><strong>${esc(ch.name)}</strong><small>${found.length?found.map(c=>`Capítulo ${c.i+1}: ${esc(c.title||'Sin título')}`).join(' · '):'No aparece literalmente en los borradores actuales; quizá está planeado para más adelante.'}</small></span><span class="pill ${found.length?'done':'warning'}">${found.length} capítulos</span></div>`}).join('');if(b.relations.length)html+=`<div class="section-head"><div><h3>Vínculos y coaparición</h3></div></div>`+b.relations.map(r=>{const found=chapters.map((c,i)=>({...c,i})).filter(c=>r.from&&r.to&&(c.draft||'').toLocaleLowerCase().includes(r.from.toLocaleLowerCase())&&(c.draft||'').toLocaleLowerCase().includes(r.to.toLocaleLowerCase()));return `<p class="smalltext"><strong>${esc(r.from||'A')} ↔ ${esc(r.to||'B')}</strong> — ${esc(r.type||'vínculo')}: ${found.length?found.map(c=>`cap. ${c.i+1}`).join(', '):'sin coapariciones literales localizadas'}</p>`}).join('');html+=`<div class="notice" style="margin-top:10px">${b.canon.trim()?`${b.canon.split(/\n+/).filter(Boolean).length} reglas de canon registradas para comprobar durante la lectura humana.`:'Aún no hay reglas de canon registradas.'} Las búsquedas son literales y pueden pasar por alto apodos, pronombres, paráfrasis o contexto.</div>`;out.innerHTML=html}
function action(b){const a=b.dataset.action;switch(a){case'open-library':openLibrary();break;case'new-book':newBook();break;case'new-project':modalProject();break;case'add-character':state.bible.characters.push({name:'',role:'',appearance:'',motivation:'',voice:'',arc:''});save();render();showToast('Ficha de personaje añadida');break;case'remove-character':if(confirm('¿Quitar este personaje de la biblia?')){state.bible.characters.splice(Number(b.dataset.index),1);save();render()}break;case'add-relation':state.bible.relations.push({from:'',to:'',type:'',notes:''});save();render();break;case'remove-relation':if(confirm('¿Eliminar este vínculo?')){state.bible.relations.splice(Number(b.dataset.index),1);save();render()}break;case'continuity-scan':continuityScan();break;case'make-matter':state.sections=matterTemplates.map((x,i)=>({id:'matter-'+Date.now()+'-'+i,area:x[0],title:x[1],content:''}));save();render();showToast('Secciones listas para completar');break;case'suggest-claims':renderClaimCandidates(Number(b.dataset.index));showToast('Candidatas listas; decide tú cuáles registrar');break;case'add-suggested-claim':{const i=Number(b.dataset.index),c=state.chapters[i],text=b.dataset.suggestion||'';if(!c||!text)break;c.claims=Array.isArray(c.claims)?c.claims:[];if(c.claims.some(x=>normalizeClaimText(x.text)===normalizeClaimText(text))){showToast('Esa afirmación ya está registrada');break}c.claims.push({text,sourceId:'',locator:'',evidenceQuote:'',status:'pending',note:`Sugerencia local por señal: ${b.dataset.reason||'patrón textual'}. Confirma si requiere respaldo.`});save();render();showToast('Afirmación añadida como pendiente de revisión')}break;case'add-claim':{const i=Number(b.dataset.index),c=state.chapters[i];if(!c)break;c.claims=Array.isArray(c.claims)?c.claims:[];c.claims.push({text:'',sourceId:'',locator:'',evidenceQuote:'',status:'pending',note:''});save();render();showToast('Afirmación registrada; añade su evidencia')}break;case'remove-claim':if(confirm('¿Eliminar este registro de afirmación y evidencia?')){const c=state.chapters[Number(b.dataset.chapterIndex)];if(c?.claims){c.claims.splice(Number(b.dataset.claimIndex),1);save();render()}}break;case'add-chapter':addChapter();break;case'save-version':saveVersion(Number(b.dataset.index));break;case'show-versions':showVersions(Number(b.dataset.index));break;case'import-manuscript':document.getElementById('manuscript-import-file').click();break;case'remove-chapter':if(confirm('¿Eliminar este capítulo y su borrador? Esta acción no se puede deshacer.')){const i=Number(b.dataset.index),removed=state.chapters[i],id=removed?.id||'ch-'+i;state.sources.forEach(s=>{s.chapterIds=(s.chapterIds||[]).filter(x=>x!==id)});state.chapters.splice(i,1);save();render()}break;case'add-source':state.sources.push({id:'source-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),title:'',year:'',publication:'',identifier:'',url:'',locator:'',accessed:'',status:'pending',use:'',chapterIds:[]});save();render();break;case'remove-source':{const i=Number(b.dataset.index),source=state.sources[i],refs=state.chapters.flatMap(c=>c.claims||[]).filter(c=>c.sourceId&&c.sourceId===source?.id).length;if(confirm(`¿Eliminar esta fuente? ${refs?refs+' afirmación(es) quedarán señaladas con una fuente no disponible.':'Esta referencia se quitará del registro.'}`)){state.sources.splice(i,1);save();render()}}break;case'export-bibliography':download((state.project.title||'bibliografia').toLowerCase().replace(/[^a-z0-9áéíóúñ]+/gi,'-')+'-bibliografia.md',`# Bibliografía de trabajo — ${state.project.title||'Libro sin título'}\n\n${bibliographyText()}\n\n> Registro de trabajo: las referencias y estados son introducidos por el autor; no están verificados automáticamente ni siguen un estilo bibliográfico normalizado.\n`,'text/markdown');showToast('Bibliografía de trabajo descargada');break;case'outline-template':{let genre=state.project.genre||'Ensayo';let templ=outlineTemplates[genre]||outlineTemplates['Ensayo'];state.chapte function openLibrary(){save();const lib=(state.library||[]).slice().sort((a,b)=>(b.updated||'').localeCompare(a.updated||''));const root=document.getElementById('modal-root');root.innerHTML=`<div class="modal-back"><div class="modal"><div class="eyebrow">La biblioteca privada</div><h2>Tus proyectos</h2><p class="smalltext">Los libros permanecen en este navegador; usa Respaldo para llevarlos a otro dispositivo.</p>${lib.length?`<div class="checklist">${lib.map(b=>`<div class="check"><div style="flex:1"><strong>${esc(b.project?.title||'Libro sin título')}</strong><small>${esc(b.project?.genre||'Sin género')} · ${b.chapters?.length||0} capítulos · actualizado ${new Date(b.updated).toLocaleDateString('es-MX')}</small></div><button class="btn small" data-open-book="${esc(b.id)}">Abrir</button></div>`).join('')}</div>`:'<div class="empty"><strong>Aún no tienes proyectos guardados</strong>Crea una ficha editorial para empezar.</div>'}<div class="toolbar"><button class="btn primary" id="library-new">+ Nuevo libro</button><button class="btn" id="library-close">Cerrar</button></div></div></div>`;root.querySelector('#library-close').onclick=()=>root.innerHTML='';root.querySelector('#library-new').onclick=()=>{root.innerHTML='';newBook()};root.querySelectorAll('[data-open-book]').forEach(btn=>btn.onclick=()=>{const id=btn.dataset.openBook;root.innerHTML='';switchBook(id)})}
function switchBook(id){const lib=state.library||[];const b=lib.find(x=>x.id===id);if(!b)return;const d=defaults();state={...d,...b,library:lib,activeId:b.id,project:{...d.project,...b.project},chapters:(b.chapters||[]).map((c,i)=>({...c,id:c.id||'ch-'+i+'-'+Date.now(),versions:c.versions||[],claims:Array.isArray(c.claims)?c.claims:[]})),sources:(b.sources||[]).map((s,i)=>({...s,id:s.id||'source-'+i+'-'+Date.now(),chapterIds:Array.isArray(s.chapterIds)?s.chapterIds:[]})),sections:b.sections||[],tasks:b.tasks||{},ratings:b.ratings||{},notes:b.notes||{}};currentView='home';save();render();showToast('Proyecto abierto')}
