<!doctype html>
<html lang="es-MX">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#183b35">
<title>Libro Maestro — Taller editorial</title>
<style>
:root{--ink:#1c2e2a;--muted:#6d7b75;--paper:#f6f3ec;--white:#fffefa;--line:#e5e1d7;--green:#234e45;--green2:#316e5f;--mint:#e7f1eb;--gold:#b5823b;--rose:#9c5547;--shadow:0 12px 38px #253e3210;--radius:18px}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:#183b35;color:#f4f0e6;padding:27px 17px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh}.brand{padding:0 12px}.brand-mark{font:700 12px/1.2 ui-serif,Georgia,serif;letter-spacing:.18em;text-transform:uppercase;color:#ddc89d}.brand h1{font:500 24px/1.1 ui-serif,Georgia,serif;margin:8px 0 4px}.brand p{margin:0;color:#b9c9c0;font-size:12px}.nav{display:grid;gap:5px}.nav button{border:0;text-align:left;color:#d5e0d9;background:transparent;border-radius:11px;padding:10px 12px;display:flex;gap:11px;align-items:center;font-size:13px}.nav button:hover,.nav button.active{background:#ffffff17;color:white}.nav .num{font-size:10px;color:#b6c9bd;opacity:.75;width:17px}.side-note{margin-top:auto;border-top:1px solid #ffffff24;padding:17px 11px 0;color:#bdccc4;font-size:11px}.side-note strong{display:block;color:#e6d6b4;font-size:12px;margin-bottom:5px}.main{min-width:0}.topbar{height:74px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,54px);background:#f8f6f1d9;position:sticky;top:0;z-index:4;backdrop-filter:blur(14px)}.crumb{font-size:12px;color:var(--muted)}.crumb b{color:var(--ink);font-weight:650}.top-actions{display:flex;align-items:center;gap:9px}.save-state{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:7px}.save-state:before{content:"";width:7px;height:7px;background:#54a078;border-radius:99px}.iconbtn,.btn{border:1px solid var(--line);background:var(--white);color:var(--ink);border-radius:10px;padding:9px 13px;font-size:12px;font-weight:600}.iconbtn:hover,.btn:hover{border-color:#aebbb2;transform:translateY(-1px)}.btn.primary{color:white;background:var(--green);border-color:var(--green)}.btn.primary:hover{background:var(--green2)}.btn.ghost{background:transparent}.btn.small{padding:7px 10px;font-size:11px}.content{max-width:1320px;margin:0 auto;padding:34px clamp(18px,4vw,54px) 70px}.eyebrow{text-transform:uppercase;font-size:10px;letter-spacing:.15em;color:var(--green2);font-weight:750}.page-title{font:500 clamp(28px,3vw,39px)/1.14 ui-serif,Georgia,serif;letter-spacing:-.035em;margin:7px 0 8px}.lead{color:var(--muted);max-width:760px;margin:0 0 24px;font-size:14px}.grid{display:grid;gap:16px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:21px;box-shadow:var(--shadow);min-width:0}.card h2,.card h3{font:500 20px/1.25 ui-serif,Georgia,serif;margin:0 0 7px}.card h3{font-size:17px}.muted{color:var(--muted)}.smalltext{font-size:12px;color:var(--muted)}.hero{background:linear-gradient(120deg,#214b41,#316456);color:#fbf8f0;border-radius:23px;padding:clamp(24px,4vw,39px);position:relative;overflow:hidden;box-shadow:var(--shadow);margin-bottom:18px}.hero:after{content:"✳";position:absolute;right:8%;top:-32px;font-size:190px;color:#ffffff0b}.hero .eyebrow{color:#ddc89d}.hero h2{font:500 clamp(28px,4vw,42px)/1.08 ui-serif,Georgia,serif;max-width:700px;margin:12px 0}.hero p{max-width:680px;color:#e3ebe5;margin:0 0 20px;font-size:14px}.hero .btn{position:relative;z-index:1}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:17px 0}.stat{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:15px 17px}.stat strong{display:block;font:500 25px ui-serif,Georgia,serif}.stat span{color:var(--muted);font-size:11px}.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:25px 0 12px}.section-head h2{font:500 23px ui-serif,Georgia,serif;margin:0}.section-head p{font-size:12px;color:var(--muted);margin:3px 0 0}.step-list{display:grid;gap:9px}.step{display:grid;grid-template-columns:35px minmax(0,1fr) auto;gap:13px;align-items:center;border:1px solid var(--line);background:var(--white);border-radius:14px;padding:13px 15px}.step-number{width:31px;height:31px;display:grid;place-items:center;background:var(--mint);color:var(--green);border-radius:50%;font-size:12px;font-weight:700}.step h3{font-family:inherit;font-size:13px;line-height:1.35;font-weight:650;margin:0}.step p{font-size:11px;color:var(--muted);margin:2px 0 0}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:30px;background:#f1efe9;color:#676f68;font-size:10px;padding:5px 9px;white-space:nowrap}.pill.done{background:#e1f0e6;color:#32714e}.pill.warning{background:#f7ede1;color:#8a5c2e}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:700;color:#47574f}.field input,.field textarea,.field select{width:100%;background:#fff;border:1px solid #dedbd2;border-radius:10px;padding:10px 11px;color:var(--ink);outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:#78a590;box-shadow:0 0 0 3px #78a59022}.field textarea{min-height:100px;resize:vertical}.hint{font-size:10px;color:#839087}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.notice{border:1px solid #e9d6b7;background:#fbf4e8;color:#755634;border-radius:12px;padding:12px 14px;font-size:12px}.notice.green{border-color:#cfe0d3;background:#edf5ef;color:#42664c}.notice.red{border-color:#e8ccc4;background:#fbefeb;color:#8b5144}.chapter-row{border:1px solid var(--line);border-radius:13px;background:#fff;padding:13px 15px;margin:9px 0;display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:start}.chapter-row input{border:0;border-bottom:1px solid #eee;background:transparent;padding:2px 4px;font-weight:650;width:100%;outline:none}.chapter-row textarea{margin-top:8px;width:100%;border:1px solid #e8e4dc;border-radius:8px;padding:10px;min-height:210px;resize:vertical;line-height:1.65}.chapter-meta{font-size:10px;color:var(--muted);margin-top:5px}.icon-x{border:0;background:transparent;color:#8d9690;font-size:17px}.source-row{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:8px;margin:8px 0}.source-row input{min-width:0;border:1px solid var(--line);border-radius:9px;padding:9px}.checklist{display:grid;gap:8px}.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #f0ede7;font-size:12px}.check:last-child{border:0}.check input{accent-color:var(--green);margin-top:3px}.check small{display:block;color:var(--muted);font-size:10px}.rating-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #f0ede7}.rating-row:last-child{border:0}.rating-row strong{font-size:12px}.rating-row p{font-size:10px;color:var(--muted);margin:2px 0 0}.rating-row select{border:1px solid var(--line);border-radius:8px;padding:7px}.cover-wrap{display:grid;grid-template-columns:minmax(180px,240px) 1fr;gap:23px;align-items:center}.book-cover{aspect-ratio:2/3;border-radius:4px 10px 10px 4px;background:linear-gradient(145deg,#1c473e,#487863);color:#f9f3e3;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;box-shadow:14px 13px 24px #23392a28;border-left:8px solid #17392f}.book-cover .cover-kicker{font-size:8px;letter-spacing:.24em;text-transform:uppercase;color:#dbca9e;margin-bottom:25px}.book-cover strong{font:500 25px/1.12 ui-serif,Georgia,serif}.book-cover em{font:italic 12px ui-serif,Georgia,serif;margin-top:13px;color:#e6decc}.book-cover span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-top:auto}.score{font:500 40px ui-serif,Georgia,serif;color:var(--green)}.progress{height:7px;background:#e9e7e0;border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;background:#5b9276;border-radius:8px;transition:width .3s}.empty{text-align:center;padding:32px 15px;color:var(--muted)}.empty strong{display:block;font:500 21px ui-serif,Georgia,serif;color:var(--ink);margin-bottom:6px}.footer-note{font-size:10px;color:#879189;margin-top:19px}.modal-back{position:fixed;inset:0;background:#15241ec9;z-index:9;display:grid;place-items:center;padding:18px}.modal{width:min(520px,100%);background:var(--white);border-radius:20px;padding:24px;box-shadow:0 25px 80px #0004}.modal h2{font:500 26px ui-serif,Georgia,serif;margin:0 0 7px}.hidden{display:none!important}.toast{position:fixed;right:20px;bottom:20px;background:#173c33;color:#fff;padding:12px 17px;border-radius:11px;box-shadow:var(--shadow);font-size:12px;z-index:10}.kpi-tag{font-size:10px;background:#eff1e9;color:#5a695f;padding:4px 8px;border-radius:20px}.foot{margin-top:28px;border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-between;gap:15px;color:#879189;font-size:10px}.mobile-head{display:none}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto;padding:12px 13px;gap:10px}.brand{display:flex;align-items:center;gap:10px}.brand h1{font-size:19px;margin:0}.brand p,.brand-mark,.side-note{display:none}.nav{display:flex;overflow:auto;gap:5px;padding:2px}.nav button{white-space:nowrap;padding:8px 10px;font-size:11px}.nav .num{display:none}.topbar{height:57px}.content{padding-top:23px}.stats{grid-template-columns:repeat(2,1fr)}.grid.three{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.grid.two,.grid.three,.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.step{grid-template-columns:31px 1fr}.step>.pill{grid-column:2;justify-self:start}.source-row{grid-template-columns:1fr}.cover-wrap{grid-template-columns:1fr;justify-items:center}.cover-wrap .cover-details{width:100%}.top-actions .save-state{display:none}.card{padding:17px}.section-head{align-items:start;flex-direction:column}.book-cover{width:205px}}
@media print{.sidebar,.topbar,.toolbar,.btn,.iconbtn,.foot{display:none!important}.app{display:block}.content{padding:0;max-width:none}.book-cover{box-shadow:none}.card,.hero{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" class="toast hidden"></div>
<script>
(()=>{'use strict';
const STORAGE='libro_maestro_v1';
const stages=[['concept','01','Idea y lector','Definir para quién escribes, qué necesidad atiende y qué lo hará distinto.'],['research','02','Investigación y sustento','Construir una base confiable de fuentes, evidencia, permisos y contexto.'],['structure','03','Arquitectura del libro','Diseñar promesa, recorrido, capítulos, ritmo y progresión.'],['draft','04','Manuscrito','Escribir con una voz consistente y metas realistas por capítulo.'],['development','05','Edición de fondo','Revisar estructura, claridad, argumento, personajes o utilidad.'],['line','06','Estilo y corrección','Pulir voz, gramática, ortografía, puntuación y consistencia.'],['integrity','07','Originalidad y derechos','Atribuir ideas, revisar permisos, citas, privacidad y uso responsable de IA.'],['production','08','Diseño y producción','Preparar cubierta, interiores, metadatos, pruebas y archivos finales.'],['release','09','Publicación y lanzamiento','Cumplir la guía vigente del canal y planear distribución y difusión.']];
const defaults=()=>({version:1,created:new Date().toISOString(),project:{title:'',author:'',genre:'Ensayo',audience:'',promise:'',objective:'',language:'Español (México)',format:'Impreso y ebook',status:'En desarrollo',coverSubtitle:'',color:'#234e45',market:'México / internacional'},chapters:[],sources:[],tasks:{},ratings:{},notes:{},platform:'Autopublicación',view:'home'});
let state=load();let currentView='home';let toastTimer;
function load(){try{const raw=localStorage.getItem(STORAGE);if(raw){const s=JSON.parse(raw);return {...defaults(),...s,project:{...defaults().project,...s.project},tasks:s.tasks||{},ratings:s.ratings||{},notes:s.notes||{},chapters:s.chapters||[],sources:s.sources||[]}}}catch(e){}return defaults()}
function save(){state.updated=new Date().toISOString();try{localStorage.setItem(STORAGE,JSON.stringify(state));const el=document.getElementById('save-status');if(el)el.textContent='Guardado en este dispositivo'}catch(e){const el=document.getElementById('save-status');if(el)el.textContent='No se pudo guardar; exporta una copia'}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function wc(s){return (s.trim().match(/\b[\p{L}\p{N}][\p{L}\p{N}'’\-]*\b/gu)||[]).length}
function totalWords(){return state.chapters.reduce((n,c)=>n+wc(c.draft||''),0)}
function doneCount(){return Object.values(state.tasks).filter(Boolean).length}
function taskCount(){return document.querySelectorAll('[data-task]').length || Object.keys(state.tasks).length}
function readiness(){const completed=doneCount();const expected=39;return Math.round(completed/Math.max(expected,Object.keys(state.tasks).length)*100)}
function showToast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.classList.add('hidden'),2400)}
function title(){return state.project.title||'Tu libro, en construcción'}
function nav(){return `<aside class="sidebar"><div class="brand"><div><div class="brand-mark">Taller editorial</div><h1>Libro Maestro</h1><p>Del primer borrador a publicación</p></div></div><nav class="nav">${[['home','⌂','Inicio'],['scope','✦','Alcance completo'],['concept','01','Concepto'],['research','02','Investigación'],['structure','03','Estructura'],['draft','04','Manuscrito'],['development','05','Edición de fondo'],['line','06','Estilo y corrección'],['integrity','07','Originalidad y derechos'],['production','08','Diseño y producción'],['release','09','Publicación']].map(([id,n,label])=>`<button data-view="${id}" class="${currentView===id?'active':''}"><span class="num">${n}</span>${label}</button>`).join('')}</nav><div class="side-note"><strong>Una obra sólida, paso a paso.</strong>Las revisiones automáticas son alertas preliminares; la decisión editorial y la verificación final siguen siendo humanas.</div></aside>`}
function shell(content){document.getElementById('app').innerHTML=`<div class="app">${nav()}<section class="main"><header class="topbar"><div class="crumb">Libro Maestro <span> / </span><b>${esc(pageName(currentView))}</b></div><div class="top-actions"><span class="save-state" id="save-status">Guardado en este dispositivo</span><button class="iconbtn" data-action="export-json">Respaldo</button></div></header><main class="content">${content}<footer class="foot"><span>Libro Maestro · espacio de trabajo local</span><span>Tu contenido permanece en este navegador hasta que lo exportes.</span></footer></main></section></div>${document.getElementById('modal-root').innerHTML}`;bind()}
function pageName(v){const x={home:'Inicio',scope:'Alcance completo',concept:'Concepto',research:'Investigación',structure:'Estructura',draft:'Manuscrito',development:'Edición de fondo',line:'Estilo y corrección',integrity:'Originalidad y derechos',production:'Diseño y producción',release:'Publicación'};return x[v]||'Inicio'}
function pageIntro(k,desc){return `<div class="eyebrow">Taller editorial · ${esc(pageName(k))}</div><h1 class="page-title">${esc(k==='home'?'Escribe un libro con oficio.':pageName(k))}</h1><p class="lead">${desc}</p>`}
function projectReady(){return !!(state.project.title&&state.project.genre&&state.project.audience)}
function stageList(){return `<div class="step-list">${stages.map(([id,n,name,desc])=>{let tasks=Object.keys(state.tasks).filter(k=>k.startsWith(id+':'));let complete=tasks.length>0&&tasks.every(k=>state.tasks[k]);return `<div class="step"><div class="step-number">${n.slice(1)}</div><div><h3>${esc(name)}</h3><p>${esc(desc)}</p></div><span class="pill ${complete?'done':''}">${complete?'✓ Etapa revisada':'En proceso'}</span></div>`}).join('')}</div>`}
function home(){let p=state.project;let pct=readiness();return `${pageIntro('home','Un método editorial integral para ficción y no ficción: idea, investigación, escritura, edición, producción y publicación. No promete bestsellers; ayuda a elevar la calidad y a tomar decisiones editoriales con criterio.')}
<div class="hero"><div class="eyebrow">Tu espacio de trabajo privado</div><h2>${esc(p.title||'Todo libro empieza con una buena pregunta.')}</h2><p>${p.title?`${esc(p.genre||'Libro')} · ${esc(p.audience||'Define a tu lector')} · ${totalWords().toLocaleString('es-MX')} palabras escritas`:'Convierte una idea en un manuscrito coherente, cuidado y preparado para una revisión profesional.'}</p><button class="btn" data-action="new-project">${p.title?'Editar ficha editorial':'Crear mi proyecto'} →</button></div>
<div class="stats"><div class="stat"><strong>${state.chapters.length}</strong><span>Capítulos / secciones</span></div><div class="stat"><strong>${totalWords().toLocaleString('es-MX')}</strong><span>Palabras en borrador</span></div><div class="stat"><strong>${state.sources.length}</strong><span>Fuentes registradas</span></div><div class="stat"><strong>${pct}%</strong><span>Lista de preparación completada</span></div></div>
<div class="grid two"><article class="card"><h2>Tu brújula editorial</h2><p class="smalltext">Antes de escribir mucho, formula con precisión a quién sirve el libro, qué ofrece y por qué importa.</p><div class="toolbar"><button class="btn primary" data-view="concept">Trabajar el concepto</button><button class="btn" data-view="structure">Diseñar la estructura</button></div><div class="notice">El potencial comercial no se puede garantizar. Aquí evaluamos propuesta, lector, diferenciación, ejecución y estrategia sin confundir una puntuación con una predicción de ventas.</div></article><article class="card"><h2>Revisión de preparación</h2><div style="display:flex;align-items:center;gap:16px;margin:10px 0"><div class="score">${pct}%</div><div class="progress" style="flex:1"><i style="width:${pct}%"></i></div></div><p class="smalltext">Lista de control editorial; no es certificación de calidad ni aprobación de una plataforma.</p><button class="btn small" data-view="release">Ver publicación y checklist →</button></article></div>
<div class="section-head"><div><h2>Las nueve etapas del oficio editorial</h2><p>Avanza en orden o vuelve a una etapa cuando la obra lo necesite.</p></div></div>${stageList()}
<div class="section-head"><div><h2>Un principio importante</h2></div></div><div class="notice red"><strong>La herramienta no detecta todo plagio y no sustituye lectura profesional.</strong> Un control serio combina trazabilidad de fuentes, citas correctas, permisos, revisión de similitud con una herramienta externa confiable y comprobación humana. Las reglas de publicación cambian: siempre contrastaremos los requisitos actuales de la editorial o plataforma elegida antes de enviar.</div>`}
function scope(){const groups=[{title:'Planificación, investigación y escritura',items:[['Crear un libro completo desde una idea: esquema, capítulos y edición','Por desarrollar'],['Planear contigo paso a paso o importar un plan preparado en ChatGPT','Base parcial: etapas y esquema; importación pendiente'],['Investigar mercado antes de escribir: demanda, competencia y palabras clave de KDP','Requiere investigación web verificable e integración'],['Importar un manuscrito que ya tengas','Por desarrollar: importador DOCX/EPUB/TXT'] ]},{title:'Diseño y producción editorial',items:[['Cubierta frontal y posterior ajustada a dimensiones exactas de KDP','Requiere generador de cubierta y plantilla oficial según formato'],['Interior listo para impresión en 6×9, 5×8, A5 y otros tamaños','Requiere motor de maquetación e impresión'],['Exportación a DOCX, PDF, EPUB y formato para Kindle','Ahora: Markdown/JSON; formatos editoriales por desarrollar'],['Organizar secciones preliminares y finales: prólogo, glosario, notas y más','Por desarrollar: gestor de secciones'],['Citas y bibliografía generadas desde el registro de fuentes','Base parcial: registro de fuentes; estilos automáticos pendientes'],['Índice final con páginas, editable manualmente','Requiere paginación final del documento maquetado'],['Imágenes con pies y tablas reales que sobrevivan a la exportación','Por desarrollar: bloques editoriales y motor de exportación'] ]},{title:'Edición, originalidad y voz',items:[['Revisión de gramática, ortografía y estilo antes de publicar','Ahora: alertas simples; corrección contextual integrada pendiente'],['Revisión de originalidad y similitud','Requiere proveedor externo; ningún detector certifica ausencia de plagio'],['Cambiar voz y tono después de escribir','Requiere edición con IA y aprobación del autor'],['Perfil de voz propio, separado por seudónimo, a partir de textos tuyos','Requiere muestras autorizadas, perfil editable y controles de privacidad'],['Entrevistarte e integrar tus historias reales sin inventar datos','Requiere flujo de entrevista, citas de audio/transcripción y confirmación factual'] ]},{title:'Series, continuidad y mundo narrativo',items:[['Series de libros con una biblia compartida entre volúmenes','Por desarrollar: proyectos relacionados y canon'],['Mapa de personajes y relaciones, retratos de referencia y arcos por volumen','Por desarrollar; retratos dependen de herramienta de imagen'],['Comprobar cada capítulo contra la biblia de la serie','Requiere motor de continuidad que cite evidencia y señale dudas, no que cambie canon solo'] ]},{title:'Otros formatos y nuevas ediciones',items:[['Crear ediciones traducidas del libro terminado','Requiere traducción asistida, glosario y revisión humana bilingüe'],['Preparar audiolibro narrado a partir del manuscrito','Requiere voz/TTS o estudio, licencias y revisión de pronunciación'],['Convertir grabaciones y podcasts en libro','Requiere transcripción, atribución de voces y verificación de hechos'] ]},{title:'IA y privacidad',items:[['Usar IA gratuita cuando esté disponible o modelos locales como Ollama','Diseño posible; disponibilidad, cuotas y calidad cambian; $0 no se puede garantizar'],['Aplicación de escritorio para Mac y Windows con archivos en tu equipo','Objetivo de arquitectura; esta versión es un HTML local en navegador'],['Usar tus notas, fuentes y archivos como base documental de la IA','Requiere importación, búsqueda local y citas hacia el material de origen'],['Historial de versiones por capítulo y restauración con un clic','Por desarrollar'] ]}];return `${pageIntro('scope','Ya incorporé el alcance de las cuatro imágenes al proyecto. Esta pantalla separa lo que el prototipo hace hoy de lo que falta construir: no presenta como terminadas funciones que aún requieren motores, servicios o pruebas.')}

function selectField(label,key,value,options){return `<div class="field"><label>${label}</label><select data-bind="${key}">${options.map(o=>`<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}

const integrityChecks=[['inventory','Tengo una lista de ideas, citas, datos e imágenes que provienen de terceros.'],['citations','Cada cita textual, paráfrasis, dato y afirmación verificable tiene fuente rastreable.'],['permissions','He comprobado permisos o licencias para imágenes, letras, tablas, fragmentos y materiales ajenos.'],['originality','La redacción propia no copia textos de otras obras; las coincidencias se revisarán con fuentes externas.'],['ai_disclosure','He revisado las políticas de la editorial/plataforma sobre contenido asistido por IA y declararé su uso cuando corresponda.'],['privacy','Tengo autorización para incluir testimonios, datos personales, fotografías o historias identificables.'],['factcheck','Los nombres, fechas, citas, cifras y referencias de riesgo están verificados contra fuentes primarias cuando es posible.']];

<div class="grid two"><article class="card"><h2>Protocolo de integridad</h2><p class="smalltext">Marca solo lo que ya comprobaste. Si una casilla no aplica, anótalo con una justificación.</p><div class="checklist">${integrityChecks.map(([k,t])=>check('integrity:'+k,t)).join('')}</div><div class="toolbar"><button class="btn primary" data-action="copy-prompt" data-prompt="integrity">Solicitar auditoría editorial de integridad</button></div></article><article class="card"><h2>Declaración de proceso y autoría</h2><p class="smalltext">Conserva el registro del uso de herramientas, fuentes y colaboradores; consulta siempre la política del sello elegido.</p>${field('Declaración / notas de derechos','notes.rights',state.notes.rights,{tag:'textarea',full:true,hint:'Anota herramientas de IA utilizadas, materiales licenciados, permisos, colaboradores, titularidad y restricciones conocidas.'})}<div class="notice red" style="margin-top:13px"><strong>Límite importante:</strong> esta versión no consulta bases de datos de similitud ni certifica originalidad. Para comparar fragmentos con publicaciones externas hace falta un servicio especializado, con suscripción/API y revisión de coincidencias por una persona.</div><button class="btn small" style="margin-top:12px" data-action="copy-prompt" data-prompt="integrity">Preparar lista de verificación para revisión humana</button></article></div>`}
function production(){let p=state.project;return `${pageIntro('production','El libro es también un objeto y un conjunto de archivos. Cubierta, interiores, accesibilidad, metadatos y pruebas deben corresponder al género, mercado y formato.')}
<div class="grid two"><article class="card"><h2>Identidad y datos de cubierta</h2><div class="form-grid">${field('Título','project.title',p.title)}${field('Autor','project.author',p.author)}${field('Subtítulo','project.coverSubtitle',p.coverSubtitle,{full:true})}${field('Color de cubierta','project.color',p.color,{attr:'type="color"'})}${selectField('Formato de publicación','project.format',p.format,['Impreso y ebook','Ebook','Impreso','Audiolibro','Otro'])}</div><div class="toolbar"><button class="btn" data-action="print">Imprimir vista de cubierta</button><button class="btn primary" data-action="copy-prompt" data-prompt="cover">Pedir propuesta visual a Zapia</button></div></article><article class="card"><h2>Vista preliminar tipográfica</h2><div class="cover-wrap"><div class="book-cover" id="cover-preview" style="background:${esc(p.color||'#234e45')}"><small class="cover-kicker">${esc(p.genre||'Libro')}</small><strong>${esc(p.title||'Título del libro')}</strong><em>${esc(p.coverSubtitle||'Subtítulo')}</em><span>${esc(p.author||'Nombre del autor')}</span></div><div class="cover-details"><div class="notice">Maqueta conceptual, no cubierta final. El diseñador debe revisar contraste, legibilidad en miniatura, sangrado, lomo, resolución y plantilla exacta de impresión.</div><div style="margin-top:13px">${checksGroup('production')}</div></div></div></article></div>`}
const publishNotes={"Autopublicación":'Consulta la guía vigente del proveedor elegido: formatos aceptados, sangrías, fuentes, cubierta, ISBN, metadatos, derechos, contenido prohibido, impuestos y territorios.',"Amazon KDP":'Verifica la guía oficial vigente de KDP para formatos, cubierta, contenido, derechos, metadatos, ISBN y declaraciones de contenido asistido por IA. Las especificaciones cambian.',"IngramSpark":'Consulta las especificaciones actuales de IngramSpark para interiores, cubierta, sangrado, ISBN, archivos, distribución, derechos y costes.',"Editorial tradicional":'Cada sello establece sus propias normas de recepción, propuesta, muestra, representación, derechos y formatos; no hay un checklist universal.',"Otro canal":'Anota el canal, país y formato y consulta su centro de ayuda oficial antes del envío.'};
function release(){return `${pageIntro('release','Cierra el manuscrito con controles editoriales y contrasta las reglas vigentes del destino. Este checklist organiza la preparación; no es aprobación legal ni certificación de una plataforma.')}
<div class="grid two"><article class="card"><h2>Destino de publicación</h2>${selectField('Canal / ruta','platform',state.platform||'Autopublicación',Object.keys(publishNotes))}<div class="notice" style="margin:13px 0">${esc(publishNotes[state.platform||'Autopublicación'])}</div><div class="field"><label>Enlace oficial de requisitos consultados</label><input data-bind="notes.publishingUrl" value="${esc(state.notes.publishingUrl||'')}" placeholder="Pega aquí el enlace oficial revisado"></div><div class="field" style="margin-top:12px"><label>Fecha de verificación / notas</label><textarea data-bind="notes.publishingRules" placeholder="País, formato, versión de requisitos, excepciones y dudas legales">${esc(state.notes.publishingRules||'')}</textarea></div></article><article class="card"><h2>Checklist de salida</h2>${checksGroup('release')}<div class="toolbar"><button class="btn primary" data-action="copy-prompt" data-prompt="release">Revisar paquete editorial con Zapia</button></div></article></div>
<div class="grid two" style="margin-top:16px"><article class="card"><h2>Panel de preparación</h2><div class="score">${readiness()}%</div><div class="progress"><i style="width:${readiness()}%"></i></div><p class="smalltext">Porcentaje de casillas marcadas del proyecto. No equivale a probabilidad de éxito, calidad certificada ni aceptación editorial.</p><div class="toolbar"><button class="btn" data-action="export-md">Exportar manuscrito</button><button class="btn" data-action="export-json">Respaldar proyecto completo</button></div></article><article class="card"><h2>Datos que aún requieren decisión humana</h2><div class="checklist">${[['finalhuman','Última lectura en pruebas reales (impresión o dispositivo).'],['contracts','Contratos, licencias, ISBN, impuestos y titularidad revisados para la jurisdicción.'],['proofread','Un lector competente, corrector o editor independiente aprobó el archivo final.'],['distribution','Distribución y lanzamiento cuentan con calendario, presupuesto y responsables.']].map(([k,t])=>check('release:'+k,t)).join('')}</div></article></div><div class="footer-note">Las normas específicas de publicación se deben comprobar en fuentes oficiales actualizadas al momento de subir cada formato. Si hay contratos, derechos, privacidad o impuestos, solicita asesoría competente para el país correspondiente.</div>`}
function promptFor(kind,idx){const p=state.project;const ch=state.chapters[idx]||{};const base=`Actúa como editor profesional de desarrollo, crítico y riguroso. Trabaja en español de México salvo que el manuscrito indique otro idioma. No inventes citas, datos, autores ni reglas editoriales. Distingue hecho, interpretación y recomendación. No reescribas la voz del autor sin explicar el motivo. Proyecto: “${p.title||'sin título'}”, género ${p.genre||'por definir'}, lector ${p.audience||'por definir'}, promesa: ${p.promise||'por definir'}.`;
const tasks={concept:`Evalúa la propuesta editorial con honestidad. Devuelve: síntesis de una frase; lector real; problema/promesa; diferenciación frente a alternativas que el autor deberá validar; vacíos; riesgos; 5 preguntas difíciles; versión más clara de la propuesta sin exagerar. No prometas ventas ni bestseller.`,research:`Audita las fuentes y afirmaciones proporcionadas. Clasifica cada afirmación como verificable, interpretación, pendiente o no sustentada. Señala qué requiere fuente primaria, contradicciones y metadatos faltantes. No fabriques fuentes. Solicita datos si no están presentes.`,structure:`Critica el mapa capítulo por capítulo: función, progreso, redundancia, lagunas, ritmo, evidencia y relación con la promesa. Prioriza problemas por gravedad y propone una nueva secuencia solo con justificación.`,chapter:`Realiza una edición diagnóstica del capítulo “${ch.title||''}” cuyo propósito es “${ch.purpose||'por definir'}”. Primero identifica tesis/función y lector; después fortalezas, problemas con ejemplos exactos, afirmaciones a comprobar, redundancias, ritmo y preguntas para el autor. No inventes fuentes ni reescribas el capítulo completo sin autorización.`,editorial:`Haz un informe de edición de fondo: propuesta y lector, fortalezas, problemas estructurales priorizados, argumento/continuidad, ritmo, redundancias, evidencia, impacto y recomendaciones accionables. Cita ejemplos textuales del manuscrito. Señala límites de tu evaluación.`,development:`Haz una lectura crítica y de desarrollo. No suavices los problemas por agradar al autor. Prioriza 5 cambios de mayor impacto y justifica cada uno con evidencia del texto. Separa observación, interpretación y recomendación.`,line:`Corrige únicamente el fragmento que comparta el autor. Devuelve (1) versión corregida, (2) lista breve de cambios relevantes, (3) dudas que requieren decisión del autor. Conserva la voz y el español regional; no cambies datos ni citas sin marcarlos.`,styleguide:`A partir de este proyecto, formula una guía de estilo provisional: voz, tono, persona, registro, términos, mayúsculas, números, citas, regionalismos y reglas de consistencia. Marca las decisiones que el autor debe aprobar.`,integrity:`Audita riesgos de integridad sin afirmar que puedes certificar ausencia de plagio. Busca atribuciones ausentes en el texto compartido, citas sin referencia, datos que requieren verificación, permisos, privacidad y uso de IA. Devuelve coincidencias o riesgos específicos y pendientes. Recomienda revisión externa de similitud cuando corresponda.`,cover:`Propón dirección creativa de cubierta con concepto, jerarquía, tipografía, paleta, imagen/metáfora, público, tres rutas diferenciadas y riesgos de cliché. No copies cubiertas existentes ni asegures ventas. Indica que medidas de lomo/sangrado dependen de paginación y plantilla de imprenta.`,release:`Prepara una lista de preguntas para comprobar la elegibilidad del manuscrito en el canal seleccionado. Usa exclusivamente reglas oficiales que el autor proporcione o fuentes actuales que puedan verificarse; no inventes requisitos. Separa revisión editorial, técnica y legal.`,product:`Diseña el plan de desarrollo de Libro Maestro a partir de esta visión de producto. Separa MVP, versiones siguientes e integraciones externas; incluye criterios de aceptación, dependencias, riesgos de privacidad, costos recurrentes, licencias y pruebas. No presentes capacidades futuras como ya construidas ni prometas bestseller o costo cero permanente. Propón entregables verificables por fase.`};return `${base}\n\nTarea: ${tasks[kind]||tasks.editorial}\n\nMaterial del proyecto: ${kind==='chapter'?ch.draft||'[Añadir borrador]':kind==='structure'?state.chapters.map((c,i)=>`${i+1}. ${c.title} — ${c.purpose||'sin propósito definido'}`).join('\n'):'[Pega aquí la sección o el material que quieres revisar]'}\n\nEntrega la crítica en español claro, concreta y orientada a mejorar el libro.`}
function addChapter(title='',purpose=''){state.chapters.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),title:title||`Capítulo ${state.chapters.length+1}`,purpose,draft:'',status:'Esquema'});save();render();showToast('Capítulo añadido')}
function render(){let html=currentView==='home'?home():currentView==='scope'?scope():currentView==='concept'?concept():currentView==='research'?research():currentView==='structure'?structure():currentView==='draft'?draft():currentView==='development'?development():currentView==='line'?line():currentView==='integrity'?integrity():currentView==='production'?production():release();shell(html)}
function updateNested(path,value){const bits=path.split('.');let o=state;for(let i=0;i<bits.length-1;i++){if(!o[bits[i]])o[bits[i]]={};o=o[bits[i]]}o[bits.at(-1)]=value;save()}
function bind(){document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{currentView=b.dataset.view;state.view=currentView;render()}));document.querySelectorAll('[data-bind]').forEach(el=>el.addEventListener('input',()=>{updateNested(el.dataset.bind,el.value);if(el.dataset.bind==='project.title'||el.dataset.bind==='project.author'||el.dataset.bind==='project.coverSubtitle'||el.dataset.bind==='project.color'){let prev=document.getElementById('cover-preview');if(prev){prev.style.background=state.project.color||'#234e45';prev.querySelector('strong').textContent=state.project.title||'Título del libro';prev.querySelector('em').textContent=state.project.coverSubtitle||'Subtítulo';prev.querySelector('span').textContent=state.project.author||'Nombre del autor'}}}));document.querySelectorAll('[data-task]').forEach(el=>el.addEventListener('change',()=>{state.tasks[el.dataset.task]=el.checked;save();render()}));document.querySelectorAll('[data-rating]').forEach(el=>el.addEventListener('change',()=>{state.ratings[el.dataset.rating]=Number(el.value);save()}));document.querySelectorAll('[data-chapter]').forEach(el=>el.addEventListener('input',()=>{const c=state.chapters[Number(el.dataset.chapter)];if(!c)return;c[el.dataset.key]=el.value;save();let tag=document.getElementById('wc-'+c.id);if(tag)tag.textContent=wc(c.draft||'')+' palabras';let meta=el.closest('.chapter-row')?.querySelector('.chapter-meta');if(meta&&el.dataset.key==='draft')meta.textContent=wc(c.draft||'')+' palabras · '+(c.status||'Borrador')}));document.querySelectorAll('[data-source]').forEach(el=>el.addEventListener('input',()=>{let i=Number(el.dataset.source);if(!state.sources[i])state.sources[i]={};state.sources[i][el.dataset.key]=el.value;save()}));document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>action(b)));}
function action(b){const a=b.dataset.action;switch(a){case'new-project':modalProject();break;case'add-chapter':addChapter();break;case'remove-chapter':if(confirm('¿Eliminar este capítulo y su borrador? Esta acción no se puede deshacer.')){state.chapters.splice(Number(b.dataset.index),1);save();render()}break;case'add-source':state.sources.push({title:'',year:'',url:'',use:''});save();render();break;case'outline-template':{let genre=state.project.genre||'Ensayo';let templ=outlineTemplates[genre]||outlineTemplates['Ensayo'];state.chapters=templ.map((t,i)=>({id:String(Date.now()+i),title:t,purpose:'Definir propósito, evidencia y vínculo con la promesa.',draft:'',status:'Esquema'}));save();render();showToast('Estructura base creada; personalízala')}break;case'export-json':download('libro-maestro-respaldo.json',JSON.stringify(state,null,2),'application/json');showToast('Respaldo descargado');break;case'export-md':exportMarkdown();break;case'import-json':document.getElementById('import-file').click();break;case'copy-prompt':copyPrompt(b.dataset.prompt,b.dataset.index);break;case'print':window.print();break;case'review-chapter':reviewChapter(Number(b.dataset.index));break;case'download-report':download('informe-editorial.md',`# Informe de lectura — ${title()}\n\n${state.notes.development||''}\n`,'text/markdown');break;case'download-spec':download('vision-libro-maestro.md',`# Visión completa de Libro Maestro\n\n${document.querySelector('main.content')?.innerText||''}\n`,'text/markdown');showToast('Visión del producto descargada');break;}}
function modalProject(){document.getElementById('modal-root').innerHTML=`<div class="modal-back" id="modal-back"><div class="modal"><div class="eyebrow">Ficha editorial</div><h2>Vamos a darle forma a tu proyecto.</h2><p class="smalltext">Esta ficha guía las decisiones del taller. Podrás cambiarla más adelante.</p><div class="form-grid" style="margin:17px 0">${field('Título de trabajo','modal.title',state.project.title)}${field('Autor / seudónimo','modal.author',state.project.author)}${selectField('Género','modal.genre',state.project.genre,['Novela','Cuento','Poesía','Ensayo','Memorias','Biografía','Libro infantil','No ficción práctica','Divulgación','Académico','Guía / manual','Otro'])}${field('Lector ideal','modal.audience',state.project.audience,{full:true})}</div><div class="toolbar"><button class="btn primary" id="save-project">Crear ficha editorial</button><button class="btn" id="cancel-modal">Cancelar</button></div></div></div>`;document.getElementById('save-project').onclick=()=>{['title','author','genre','audience'].forEach(k=>{let el=document.querySelector(`[data-bind="modal.${k}"]`);if(el)state.project[k]=el.value});save();document.getElementById('modal-root').innerHTML='';currentView='concept';render();showToast('Ficha guardada')};document.getElementById('cancel-modal').onclick=()=>document.getElementById('modal-root').innerHTML=''}
function copyPrompt(kind,idx){const text=promptFor(kind,idx);if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>showToast('Encargo copiado; pégalo en el chat de Zapia')).catch(()=>prompt('Copia este encargo editorial:',text));else prompt('Copia este encargo editorial:',text)}
function reviewChapter(i){const c=state.chapters[i];if(!c)return;const text=c.draft||'';const sentences=text.split(/[.!?]+\s+/).filter(Boolean);const long=sentences.filter(s=>wc(s)>38).length;const repeated=(text.match(/\b(\p{L}{3,})\s+\1\b/giu)||[]).length;const placeholders=(text.match(/\b(TODO|TBD|CITA|FUENTE PENDIENTE|VERIFICAR)\b/gi)||[]).length;const result=`<div class="notice" style="margin-top:9px"><strong>Alertas preliminares — ${wc(text)} palabras:</strong> ${long} oración(es) de más de 38 palabras; ${repeated} repetición(es) inmediata(s); ${placeholders} marcador(es) de trabajo. Esto no corrige estilo, no revisa coherencia ni detecta plagio. Úsalo como guía, no como veredicto.</div>`;let el=document.getElementById('review-'+c.id);if(el)el.innerHTML=result}
function exportMarkdown(){const p=state.project;let md=`# ${p.title||'Libro sin título'}\n\n**Autor:** ${p.author||'Pendiente'}  \n**Género:** ${p.genre||'Pendiente'}  \n**Lector:** ${p.audience||'Pendiente'}  \n**Promesa:** ${p.promise||'Pendiente'}\n\n`;for(const c of state.chapters)md+=`\n## ${c.title||'Capítulo'}\n\n${c.purpose?`> Propósito: ${c.purpose}\n\n`:''}${c.draft||''}\n`;if(state.sources.length){md+='\n# Fuentes registradas\n';state.sources.forEach(s=>md+=`\n- ${s.title||'Autor/título pendiente'} (${s.year||'s.f.'}). ${s.url||''}${s.use?` — ${s.use}`:''}\n`)}download((p.title||'manuscrito').toLowerCase().replace(/[^a-z0-9áéíóúñ]+/gi,'-')+'.md',md,'text/markdown');showToast('Manuscrito exportado en Markdown')}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.addEventListener('change',e=>{if(e.target&&e.target.id==='import-file'){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{state=JSON.parse(reader.result);save();render();showToast('Respaldo importado')}catch(err){showToast('El archivo no parece un respaldo válido')}};reader.readAsText(file)}});
render();
})();
</script>
<input type="file" id="import-file" accept="application/json,.json" class="hidden">
</body></html>
