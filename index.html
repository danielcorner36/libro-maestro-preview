function modalProject(){document.getElementById('modal-root').innerHTML=`<div class="modal-back" id="modal-back"><div class="modal"><div class="eyebrow">Ficha editorial</div><h2>Vamos a darle forma a tu proyecto.</h2><p class="smalltext">Esta ficha guía las decisiones del taller. Podrás cambiarla más adelante.</p><div class="form-grid" style="margin:17px 0">${field('Título de trabajo','modal.title',state.project.title)}${field('Autor / seudónimo','modal.author',state.project.author)}${selectField('Género','modal.genre',state.project.genre,['Novela','Cuento','Poesía','Ensayo','Memorias','Biografía','Libro infantil','No ficción práctica','Divulgación','Académico','Guía / manual','Otro'])}${field('Lector ideal','modal.audience',state.project.audience,{full:true})}</div><div class="toolbar"><button class="btn primary" id="save-project">Crear ficha editorial</button><button class="btn" id="cancel-modal">Cancelar</button></div></div></div>`;document.getElementById('save-project').onclick=()=>{['title','author','genre','audience'].forEach(k=>{let el=document.querySelector(`[data-bind="modal.${k}"]`);if(el)state.project[k]=el.value});save();document.getElementById('modal-root').innerHTML='';currentView='concept';render();showToast('Ficha guardada')};document.getElementById('cancel-modal').onclick=()=>document.getElementById('modal-root').innerHTML=''}
function openIntegrityChapterPicker(){if(!state.chapters.length){showToast('Añade o importa un capítulo primero');return}const root=document.getElementById('modal-root');const options=state.chapters.map((c,i)=>`<option value="${i}">${i+1}. ${esc(c.title||'Sin título')} · ${wc(c.draft||'')} palabras</option>`).join('');root.innerHTML=`<div class="modal-back"><div class="modal"><div class="eyebrow">Revisión textual · privacidad</div><h2>Auditar un capítulo</h2><p class="smalltext">Elige un capítulo para incluir su borrador completo y el registro de fuentes/afirmaciones del proyecto. Para manuscritos largos, trabaja capítulo por capítulo.</p><div class="field"><label for="integrity-chapter-select">Capítulo</label><select id="integrity-chapter-select">${options}</select></div><div class="notice red" style="margin-top:12px">Al continuar, el texto seleccionado se copiará al portapapeles. No se envía automáticamente. Si después lo pegas en Zapia u otro servicio, compartirás ese contenido con ese servicio; revisa y anonimiza datos sensibles de terceros.</div><div class="toolbar"><button class="btn primary" id="integrity-chapter-copy">Copiar capítulo para revisión</button><button class="btn" id="integrity-chapter-cancel">Cancelar</button></div></div></div>`;root.querySelector('#integrity-chapter-cancel').onclick=()=>root.innerHTML='';root.querySelector('#integrity-chapter-copy').onclick=()=>{const i=Number(root.querySelector('#integrity-chapter-select').value),c=state.chapters[i];if(!c?.draft?.trim()){showToast('Este capítulo no tiene texto para auditar');return}root.innerHTML='';copyPrompt('integrityChapter',i)}}function copyPrompt(kind,idx){const text=promptFor(kind,idx),message=kind==='integrityChapter'?'Capítulo y registros copiados; no se envió nada':'Encargo copiado; pégalo en el chat de Zapia';if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>showToast(message)).catch(()=>prompt(kind==='integrityChapter'?'Copia el capítulo y sus registros; no se enviará automáticamente:':'Copia este encargo editorial:',text));else prompt(kind==='integrityChapter'?'Copia el capítulo y sus registros; no se enviará automáticamente:':'Copia este encargo editorial:',text)}
function reviewChapter(i){const c=state.chapters[i];if(!c)return;const text=c.draft||'';const sentences=text.split(/[.!?]+\s+/).filter(Boolean);const long=sentences.filter(s=>wc(s)>38).length;const repeated=(text.match(/\b(\p{L}{3,})\s+\1\b/giu)||[]).length;const placeholders=(text.match(/\b(TODO|TBD|CITA|FUENTE PENDIENTE|VERIFICAR)\b/gi)||[]).length;const result=`<div class="notice" style="margin-top:9px"><strong>Alertas preliminares — ${wc(text)} palabras:</strong> ${long} oración(es) de más de 38 palabras; ${repeated} repetición(es) inmediata(s); ${placeholders} marcador(es) de trabajo. Esto no corrige estilo, no revisa coherencia ni detecta plagio. Úsalo como guía, no como veredicto.</div>`;let el=document.getElementById('review-'+c.id);if(el)el.innerHTML=result}
function xmlEsc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;')}
function htmlEsc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function textBlocks(v){return String(v||'').replace(/\r/g,'').trim().split(/\n\s*\n/).filter(Boolean)}
function htmlBlocks(v){return textBlocks(v).map(x=>`<p>${htmlEsc(x).replace(/\n/g,'<br />')}</p>`).join('')}
function zipStore(files){const enc=new TextEncoder(),parts=[],central=[];let offset=0;const table=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xedb88320^(c>>>1)):(c>>>1);table[n]=c>>>0}function crc(data){let c=0xffffffff;for(let i=0;i<data.length;i++)c=table[(c^data[i])&255]^(c>>>8);return (c^0xffffffff)>>>0}function cat(arrays){let size=arrays.reduce((n,a)=>n+a.length,0),out=new Uint8Array(size),at=0;arrays.forEach(a=>{out.set(a,at);at+=a.length});return out}for(const [name,value] of files){const nb=enc.encode(name),data=value instanceof Uint8Array?value:enc.encode(String(value)),sum=crc(data),local=new Uint8Array(30+nb.length),lv=new DataView(local.buffer);lv.setUint32(0,0x04034b50,true);lv.setUint16(4,20,true);lv.setUint16(6,0x0800,true);lv.setUint16(8,0,true);lv.setUint16(10,0,true);lv.setUint16(12,33,true);lv.setUint32(14,sum,true);lv.setUint32(18,data.length,true);lv.setUint32(22,data.length,true);lv.setUint16(26,nb.length,true);lv.setUint16(28,0,true);local.set(nb,30);parts.push(local,data);const cent=new Uint8Array(46+nb.length),cv=new DataView(cent.buffer);cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0x0800,true);cv.setUint16(10,0,true);cv.setUint16(12,0,true);cv.setUint16(14,33,true);cv.setUint32(16,sum,true);cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);cv.setUint16(28,nb.length,true);cv.setUint16(30,0,true);cv.setUint16(32,0,true);cv.setUint16(34,0,true);cv.setUint16(36,0,true);cv.setUint32(38,0,true);cv.setUint32(42,offset,true);cent.set(nb,46);central.push(cent);offset+=local.length+data.length}const cdir=cat(central),end=new Uint8Array(22),ev=new DataView(end.buffer);ev.setUint32(0,0x06054b50,true);ev.setUint16(4,0,true);ev.setUint16(6,0,true);ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);ev.setUint32(12,cdir.length,true);ev.setUint32(16,offset,true);ev.setUint16(20,0,true);return cat([...parts,cdir,end])}

function resolveZipPath(base,href){let raw=String(href||'').split(/[?#]/)[0].replace(/\\/g,'/').replace(/^\/+/, '');try{raw=raw.split('/').map(decodeURIComponent).join('/')}catch(e){}const parts=[];for(const part of `${base?base+'/':''}${raw}`.split('/')){if(!part||part==='.')continue;if(part==='..'){if(!parts.length)throw new Error('El EPUB contiene una ruta no válida.');parts.pop()}else parts.push(part)}return parts.join('/')}
function epubBlocks(body){const out=[],block=/^(P|H[1-6]|LI|BLOCKQUOTE|PRE|TR)$/i,skip=/^(SCRIPT|STYLE|NAV|SVG|NOSCRIPT|HEADER|FOOTER|ASIDE)$/i;function walk(n){if(n.nodeType!==1)return;if(skip.test(n.tagName))return;if(block.test(n.tagName)){const text=(n.textContent||'').replace(/\s+/g,' ').trim();if(text)out.push({tag:n.tagName.toLowerCase(),text});return}Array.from(n.childNodes).forEach(walk)}walk(body);return out}
function epubImport(bytes,fileName){const first=unzipAllowed(bytes,n=>n==='META-INF/container.xml'),container=parseXmlSafe(zipText(first,'META-INF/container.xml'),'contenedor EPUB'),root=container.getElementsByTagNameNS('urn:oasis:names:tc:opendocument:xmlns:container','rootfile')[0],opfPath=resolveZipPath('',root?.getAttribute('full-path')||'');if(!opfPath)throw new Error('El EPUB no identifica su archivo de contenido principal.');const base=opfPath.includes('/')?opfPath.slice(0,opfPath.lastIndexOf('/')):'',files=unzipAllowed(bytes,n=>n===opfPath||/\.(xhtml|html|htm)$/i.test(n)),opf=parseXmlSafe(zipText(files,opfPath),'paquete EPUB'),opfNS='http://www.idpf.org/2007/opf',dcNS='http://purl.org/dc/elements/1.1/',title=opf.getElementsByTagNameNS(dcNS,'title')[0]?.textContent?.trim()||'',author=opf.getElementsByTagNameNS(dcNS,'creator')[0]?.textContent?.trim()||'',manifest=new Map();Array.from(opf.getElementsByTagNameNS(opfNS,'item')).forEach(item=>manifest.set(item.getAttribute('id'),item));const spine=opf.getElementsByTagNameNS(opfNS,'spine')[0];if(!spine)throw new Error('El EPUB no contiene un orden de lectura (spine) reconocible.');const refs=Array.from(spine.getElementsByTagNameNS(opfNS,'itemref')),chapters=[];for(const ref of refs){const item=manifest.get(ref.getAttribute('idref'));if(!item)continue;const type=item.getAttribute('media-type')||'',props=item.getAttribute('properties')||'';if(!/application\/(xhtml\+xml|xhtml|html)/i.test(type)||/\bnav\b/i.test(props))continue;const path=resolveZipPath(base,item.getAttribute('href')||''),xhtml=zipText(files,path);if(!xhtml)continue;const html=new DOMParser().parseFromString(xhtml,'text/html'),body=html.body||html.documentElement;if(!body)continue;const blocks=epubBlocks(body);if(!blocks.length)continue;const headingIndex=blocks.findIndex(b=>b.tag==='h1'||b.tag==='h2'),heading=headingIndex>=0?blocks[headingIndex].text:'',content=blocks.filter((b,i)=>i!==headingIndex).map(b=>b.text).join('\n\n').trim(),fallback=path.split('/').pop().replace(/\.(xhtml|html|htm)$/i,'').replace(/[-_]+/g,' ');chapters.push(chapterRecord(heading||fallback||title||'Capítulo',content))}if(!chapters.length)throw new Error('No encontré capítulos de texto en el orden de lectura del EPUB.');return{title,author,chapters}}
function finishImport(parsed,append){const next=append?[...state.chapters,...parsed.chapters]:parsed.chapters,check={...state,chapters:next};if(check.activeId&&check.library){const pos=check.library.findIndex(x=>x.id===check.activeId);if(pos>=0)check.library[pos]={...check.library[pos],chapters:next,project:check.project,bible:check.bible}}const size=JSON.stringify(check).length;if(size>IMPORT_LOCAL_LIMIT){showToast('El texto excede el espacio seguro de guardado local; prueba importar el manuscrito por partes.');return}if(parsed.title&&!state.project.title)state.project.title=parsed.title;if(parsed.author&&!state.project.author)state.project.author=parsed.author;state.chapters=next;const root=document.getElementById('modal-root');if(root)root.innerHTML='';save();let persisted=false;try{persisted=JSON.parse(localStorage.getItem(STORAGE)||'{}').updated===state.updated}catch(e){}currentView='draft';render();showToast(persisted?`${parsed.chapters.length} capítulo(s) importado(s); revisa división y formato`:'No se pudo guardar todo; descarga un respaldo o importa menos texto')}
function showImportChoices(parsed,fileName){if(!parsed.chapters?.length){showToast('No se encontró texto importable en ese archivo.');return}const root=document.getElementById('modal-root');if(!state.chapters.length){finishImport(parsed,false);return}root.innerHTML=`<div class="modal-back"><div class="modal"><div class="eyebrow">Importación local · ${esc(fileName)}</div><h2>¿Cómo incorporamos el manuscrito?</h2><p>Encontré ${parsed.chapters.length} capítulo(s). Puedes conservar lo que ya está en este proyecto o reemplazar sus capítulos.</p><div class="notice">La lectura ocurre en este navegador; el archivo no se sube. Se extrae texto y títulos, no se conserva la maquetación, imágenes, comentarios ni notas al pie.</div><div class="toolbar"><button class="btn primary" id="import-append">Añadir al final</button><button class="btn" id="import-replace">Reemplazar capítulos</button><button class="btn" id="import-cancel">Cancelar</button></div><p class="smalltext">Antes de reemplazar, descarga un Respaldo JSON si quieres conservar los borradores actuales.</p></div></div>`;root.querySelector('#import-append').onclick=()=>finishImport(parsed,true);root.querySelector('#import-replace').onclick=()=>{if(confirm('¿Reemplazar los capítulos actuales? Asegúrate de haber descargado un respaldo si quieres conservarlos.'))finishImport(parsed,false)};root.querySelector('#import-cancel').onclick=()=>root.innerHTML=''}
function readOfficeManuscript(file,input){if(file.size>IMPORT_COMPRESSED_LIMIT){showToast('El archivo supera 20 MB; divídelo y prueba por partes.');input.value='';return}const reader=new FileReader();reader.onload=()=>{try{const bytes=new Uint8Array(reader.result),parsed=/\.docx$/i.test(file.name)?docxImport(bytes,file.name):epubImport(bytes,file.name);parsed.title=parsed.title||file.name.replace(/\.(docx|epub)$/i,'').replace(/[-_]+/g,' ');showImportChoices(parsed,file.name)}catch(err){const message=String(err?.message||'');showToast(/^(El |No pude|No encontré)/i.test(message)?message:'No pude leer el archivo. Comprueba que sea un DOCX o EPUB válido y no esté dañado.')}finally{input.value=''}};reader.onerror=()=>{showToast('No pude leer el archivo desde este dispositivo.');input.value=''};reader.readAsArrayBuffer(file)}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.addEventListener('change',e=>{if(e.target&&e.target.id==='import-file'){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{state=JSON.parse(reader.result);save();render();showToast('Respaldo importado')}catch(err){showToast('El archivo no parece un respaldo válido')}};reader.readAsText(file)}});
document.addEventListener('change',e=>{if(e.target&&e.target.id==='manuscript-import-file'){const file=e.target.files[0];if(!file)return;if(file.size>IMPORT_COMPRESSED_LIMIT){showToast('El archivo supera 20 MB; divídelo y prueba por partes.');e.target.value='';return}if(/\.(docx|epub)$/i.test(file.name)){readOfficeManuscript(file,e.target);return}const reader=new FileReader();reader.onload=()=>{let text=String(reader.result||'').replace(/\r\n?/g,'\n');const h1=text.match(/^#\s+(.+)$/m),importedTitle=h1?h1[1].trim():'';if(h1)text=text.replace(h1[0],'').trim();const hs=[...text.matchAll(/^##\s+(.+)$/gm)];let imported=[];if(hs.length){const lead=text.slice(0,hs[0].index).trim();if(lead)imported.push({id:String(Date.now()),title:'Texto inicial',purpose:'Contenido previo al primer capítulo',draft:lead,status:'Importado',versions:[]});hs.forEach((m,n)=>{const start=m.index+m[0].length;const end=n+1<hs.length?hs[n+1].index:text.length;imported.push({id:String(Date.now()+n+1),title:m[1].trim(),purpose:'',draft:text.slice(start,end).trim(),status:'Importado',versions:[]})})}else imported=[{id:String(Date.now()),title:file.name.replace(/\.(md|txt)$/i,'')||'Manuscrito importado',purpose:'Importado desde archivo de texto',draft:text,status:'Importado',versions:[]}];showImportChoices({title:importedTitle||file.name.replace(/\.(md|txt)$/i,''),author:'',chapters:imported},file.name)};reader.onerror=()=>showToast('No se pudo leer el archivo');reader.readAsText(file);e.target.value=''}});
render();
})();
</script>
